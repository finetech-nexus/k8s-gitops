name: Purge KYC clients

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type purge-clients to delete clients/verifications and seed 100 Tunisian cases
        required: true
        type: string

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation
        run: test "${{ github.event.inputs.confirm }}" = "purge-clients"
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Purge clients and seed Tunisian scenarios
        run: |
          # Wait for API pod to be ready after image rollouts.
          kubectl -n kyc-aml rollout status deploy/clarity-api --timeout=300s
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - << 'PY'
          import os
          from pathlib import Path

          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from app.engine import build_engine
          from app.ids import TENANT_ID
          from app.seed import DEMO_SEED_VERSION, reseed_demo_clients
          from sqlalchemy import text

          settings = Settings()
          reset_runtime_overlay()
          bind_settings(settings)
          database = Database(settings.database_url)
          database.create_all()
          processes = Path("/srv/clarity/flowable/processes")
          engine, _error = build_engine(
              settings.flowable_url,
              settings.flowable_user,
              settings.flowable_password,
              processes if processes.exists() else Path("flowable/processes"),
          )
          db = database.session_factory()
          try:
              before = db.execute(text("SELECT COUNT(*) FROM customers")).scalar()
              print("before_customers", before)
              result = reseed_demo_clients(db, engine)
              db.commit()
              after = db.execute(text("SELECT COUNT(*) FROM customers")).scalar()
              print("after_customers", after, "seed", result, "version", DEMO_SEED_VERSION, "tenant", TENANT_ID)
          except Exception:
              db.rollback()
              raise
          finally:
              db.close()
          PY
