name: Repair — elasticsearch

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Patch ES heap and free memory for Kibana
        run: |
          set -e
          echo "===== before"
          kubectl get pods -n infra -o wide | grep -E 'NAME|elastic|kibana|mongo|rpconsole' || kubectl get pods -n infra
          # Non-essential UI can wait — free RAM so Kibana schedules.
          kubectl scale deploy -n infra mongo-express --replicas=0 2>/dev/null || true
          kubectl scale deploy -n infra rpconsole --replicas=0 2>/dev/null || true
          # Force heap on master (GitOps chart was leaving default 128m).
          kubectl set env sts/infra-elasticsearch-master -n infra ELASTICSEARCH_HEAP_SIZE=1536m
          kubectl set env sts/infra-elasticsearch-data -n infra ELASTICSEARCH_HEAP_SIZE=1024m
          kubectl patch sts infra-elasticsearch-master -n infra --type='json' -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/resources/requests/memory","value":"1800Mi"},
            {"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"4Gi"}
          ]' || true
          kubectl scale sts infra-elasticsearch-master -n infra --replicas=1
          kubectl scale sts infra-elasticsearch-data -n infra --replicas=1
          kubectl delete pod -n infra infra-elasticsearch-master-0 --force --grace-period=0 || true
          echo "===== wait master"
          kubectl rollout status sts/infra-elasticsearch-master -n infra --timeout=10m
          echo "===== wait data"
          kubectl rollout status sts/infra-elasticsearch-data -n infra --timeout=10m
          kubectl get pods -n infra | grep -i elastic
          kubectl delete pod es-probe -n infra --ignore-not-found
          kubectl run es-probe --rm -i --restart=Never -n infra --image=curlimages/curl:8.10.1 -- sh -c '
            for i in $(seq 1 24); do
              if curl -sf -u elastic:elasticSearchPas42 "http://infra-elasticsearch:9200/_cluster/health?pretty"; then
                curl -sf -u elastic:elasticSearchPas42 -X PUT "http://infra-elasticsearch:9200/_all/_settings" \
                  -H "Content-Type: application/json" \
                  -d "{\"index\":{\"number_of_replicas\":0}}" || true
                curl -sf -u elastic:elasticSearchPas42 "http://infra-elasticsearch:9200/_cluster/health?pretty"
                exit 0
              fi
              sleep 10
            done
            echo "ES never became healthy"; exit 1
          '
          kubectl scale deploy -n infra infra-kibana --replicas=1
          kubectl delete pod -n infra -l app.kubernetes.io/name=kibana --force --grace-period=0 2>/dev/null || true
          kubectl rollout status deploy/infra-kibana -n infra --timeout=5m || true
          echo "===== after"
          kubectl get pods -n infra | grep -E 'elastic|kibana' || true
          kubectl get sts infra-elasticsearch-master -n infra -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\n' | grep -i heap || true
