name: Repair — elasticsearch

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Reconcile infra HelmRelease
        run: |
          flux reconcile source git flux-system -n flux-system --timeout=1m || true
          flux reconcile kustomization infra -n flux-system --timeout=3m || true
          flux reconcile helmrelease infra -n infra --timeout=5m || true
      - name: Restore ES topology (master + data) and heal indices
        run: |
          set +e
          echo "===== before"
          kubectl get pods,sts -n infra | grep -i elastic || true
          # Data node was healthy; master OOM'd at 128m. Keep both with fixed master heap.
          kubectl scale sts infra-elasticsearch-master -n infra --replicas=1
          kubectl scale sts infra-elasticsearch-data -n infra --replicas=1
          kubectl delete pod -n infra infra-elasticsearch-master-0 --force --grace-period=0 2>/dev/null || true
          echo "===== wait master"
          kubectl rollout status sts/infra-elasticsearch-master -n infra --timeout=8m
          echo "===== wait data"
          kubectl rollout status sts/infra-elasticsearch-data -n infra --timeout=8m
          kubectl get pods -n infra | grep -i elastic || true
          kubectl delete pod es-probe -n infra --ignore-not-found
          kubectl run es-probe --rm -i --restart=Never -n infra --image=curlimages/curl:8.10.1 -- sh -c '
            set -e
            for i in $(seq 1 20); do
              if curl -sf -u elastic:elasticSearchPas42 http://infra-elasticsearch:9200/_cluster/health?pretty; then
                break
              fi
              sleep 15
            done
            # Single-replica sandbox: drop replica requirement so RED→YELLOW/GREEN.
            curl -sf -u elastic:elasticSearchPas42 -X PUT "http://infra-elasticsearch:9200/_all/_settings" \
              -H "Content-Type: application/json" \
              -d "{\"index\":{\"number_of_replicas\":0}}" || true
            sleep 5
            curl -sf -u elastic:elasticSearchPas42 "http://infra-elasticsearch:9200/_cluster/health?pretty"
            curl -sf -u elastic:elasticSearchPas42 "http://infra-elasticsearch:9200/_cat/indices?v" | head -40
          '
          kubectl rollout restart deploy/infra-kibana -n infra || true
          kubectl rollout status deploy/infra-kibana -n infra --timeout=5m || true
          echo "===== after"
          kubectl get pods -n infra | grep -E "elastic|kibana" || true
