name: Diagnose — account-hook
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Rollout nexus-bank-api 494a8ed
        run: |
          set +e
          echo '=== app deploys ==='
          kubectl -n app get deploy -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas
          echo '=== find nexus-bank-api ==='
          NAME=$(kubectl -n app get deploy -o name | grep -iE 'nexus-bank-api|nexusbank' | head -1)
          echo NAME=$NAME
          if [ -z "$NAME" ]; then
            kubectl -n app get deploy -o yaml | grep -E 'name:|image:' | head -80
            exit 1
          fi
          echo '=== set image 494a8ed ==='
          kubectl -n app set image "$NAME" "*=nexusbank/nexus-bank-api:494a8ed"
          kubectl -n app rollout status "$NAME" --timeout=180s
          kubectl -n app get "$NAME" -o jsonpath='image={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
          kubectl -n app logs "$NAME" --tail=30 | grep -iE 'me/status|token exchanged|listening|error' || true
