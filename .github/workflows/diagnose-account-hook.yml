name: Diagnose — account-hook
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Inspect hook delivery and workflowservice error
        run: |
          set +e
          echo '=== clarity hook env ==='
          kubectl -n kyc-aml get deploy clarity-api -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | grep -E 'HOOK|SECRET' || true
          echo '=== workflowservice recent logs ==='
          kubectl -n kyc logs deploy/workflowservice --since=45m --tail=400 2>&1 | tail -n 200
          echo '=== stored account_hook for Mohamed ==='
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import json, os
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          row = db.execute(text("select id, state, context from workflow_instances where id=:id"), {"id":"331396fb-65b1-4b3a-8817-1e2d94d47266"}).mappings().first()
          ctx = row["context"] if row else {}
          if isinstance(ctx, str): ctx = json.loads(ctx)
          hook = (ctx or {}).get("account_hook") or {}
          print("status", hook.get("status"), "delivered", hook.get("delivered"))
          print("response", (hook.get("response") or "")[:800])
          payload = hook.get("payload") or {}
          print("eventName", payload.get("eventName"))
          print("workflowFinalState", payload.get("workflowFinalState"))
          print("workflowRuntimeId", payload.get("workflowRuntimeId"))
          print("ballerineEntityId", payload.get("ballerineEntityId"))
          print("correlationId", payload.get("correlationId"))
          data = payload.get("data") or {}
          print("entity", json.dumps(data.get("entity"), default=str)[:1000])
          docs = data.get("documents") or []
          print("documents_count", len(docs))
          if docs:
              print("doc0", json.dumps(docs[0], default=str)[:800])
          PY
