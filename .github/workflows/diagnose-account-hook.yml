name: Diagnose — account-hook
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Partial case poll path
        run: |
          set +e
          PARTIAL=a6f5ef7c-d7c7-4f93-8978-42cf9f0f0052
          echo '=== partial runtime GET ==='
          kubectl -n api exec deploy/core-api-kyc-api -- node -e "
            const ep=process.env.BALLERINE_ENDPOINT, key=process.env.BALLERINE_API_KEY;
            fetch(ep+'/api/v1/external/workflows/$PARTIAL',{headers:{Authorization:'Bearer '+key}})
              .then(async r=>{const j=await r.json(); console.log(JSON.stringify({http:r.status,id:j.id,state:j.state,status:j.status},null,2));});
          "
          echo '=== all workflows for Mohamed Miladi ==='
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import os, json
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          cust = db.execute(text("select id, display_name, canonical_status, external_ref from customers where display_name = 'Mohamed Miladi'")).mappings().first()
          print("customer", dict(cust) if cust else None)
          if not cust: raise SystemExit(0)
          rows = db.execute(text("""
            select id, ballerine_runtime_id, definition_key, state, status, created_at
            from workflow_instances where customer_id=:cid order by created_at desc
          """), {"cid": cust["id"]}).mappings().all()
          for r in rows:
              print(dict(r))
          PY
          echo '=== hit kyc-api status with reviewRuntimeId (via port-forward style in-cluster) ==='
          # Call status endpoint from within cluster through kyc-api itself is hard without auth session.
          # Instead replicate soft-fail / mapping with both collection + review if present.
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import os, json
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          cust = db.execute(text("select id from customers where display_name = 'Mohamed Miladi'")).mappings().first()
          rows = db.execute(text("select ballerine_runtime_id, definition_key, state from workflow_instances where customer_id=:cid"), {"cid": cust["id"]}).mappings().all()
          # Simulate mobile polling ONLY collection if that's what they stored
          for r in rows:
              state=str(r["state"] or "").lower()
              if state in ("approved-partially","approved_partially"): mapped="approved-partially"
              elif state=="approved": mapped="verified"
              elif state in ("final","manual_review","manual-review"): mapped="pending"
              else: mapped="pending"
              print("poll", r["definition_key"], r["ballerine_runtime_id"], "state", r["state"], "→ mobile", mapped)
          PY
