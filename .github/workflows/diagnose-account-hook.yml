name: Diagnose — account-hook
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Core-banking onboarding + IAM
        run: |
          set +e
          echo '=== IAM pods ==='
          kubectl -n iam get pods -o wide
          echo '=== Keycloak OIDC probe ==='
          kubectl -n iam exec deploy/keycloak -- curl -sf -o /dev/null -w 'oidc=%{http_code}\n' http://127.0.0.1:8080/auth/realms/internal/.well-known/openid-configuration 2>/dev/null \
            || kubectl -n iam get pods
          echo '=== core-api-core-banking-api pods ==='
          kubectl -n api get pods | grep -iE 'core-banking|cbanking' || kubectl -n api get pods | head -40
          echo '=== cbanking logs (onboarding) ==='
          for d in core-api-core-banking-api core-banking-api cbanking-api; do
            kubectl -n api logs deploy/$d --since=60m --tail=400 2>/dev/null | grep -iE 'onboarding|Register user|error|Error|ECONN|timeout|500|Keycloak|failed' | tail -80 && break
          done
          echo '=== workflowservice ONBORDING/KEYCLOAK env ==='
          kubectl -n kyc get deploy workflowservice -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | grep -iE 'ONBORDING|KEYCLOAK|TENANT|WEBHOOK' || true
          echo '=== probe cbanking from workflowservice pod ==='
          kubectl -n kyc exec -i deploy/workflowservice -- node -e '
            const https=require("https");
            const url=process.env.ONBORDING_URL||"";
            console.log("ONBORDING_URL", url);
            const u=new URL(url);
            const req=https.request({hostname:u.hostname,path:u.pathname,method:"GET",rejectUnauthorized:false,timeout:8000},res=>{
              let d=""; res.on("data",c=>d+=c); res.on("end",()=>console.log("get",res.statusCode,d.slice(0,200)));
            });
            req.on("error",e=>console.log("err",e.message));
            req.on("timeout",()=>{console.log("timeout"); req.destroy();});
            req.end();
          ' 2>&1 | tail -20
