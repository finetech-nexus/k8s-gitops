name: Diagnose — account-hook
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Poll status path like mobile
        run: |
          set +e
          echo '=== kyc-api BALLERINE_ENDPOINT ==='
          kubectl -n api get deploy core-api-kyc-api -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | grep -iE 'BALLERINE|CLARITY' || true
          echo '=== Clarity workflow by runtime id ==='
          RID=0f91357a-cc6e-48ea-8617-d246d37d4c6f
          WID=331396fb-65b1-4b3a-8817-1e2d94d47266
          KEY=$(kubectl -n api get deploy core-api-kyc-api -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | sed -n 's/^BALLERINE_API_KEY=//p')
          EP=$(kubectl -n api get deploy core-api-kyc-api -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | sed -n 's/^BALLERINE_ENDPOINT=//p')
          echo "EP=$EP"
          echo "--- GET runtime ---"
          kubectl -n api exec deploy/core-api-kyc-api -- node -e "
            const ep=process.env.BALLERINE_ENDPOINT;
            const key=process.env.BALLERINE_API_KEY;
            const id='$RID';
            fetch(ep+'/api/v1/external/workflows/'+id,{headers:{Authorization:'Bearer '+key}})
              .then(async r=>{const t=await r.text(); console.log('status',r.status); console.log(t.slice(0,1500));})
              .catch(e=>console.log('err',e.message));
          "
          echo '=== Clarity DB states for Mohamed ==='
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import json, os
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          rows = db.execute(text("""
            select w.id, w.ballerine_runtime_id, w.definition_key, w.state, w.status, c.display_name, c.canonical_status
            from workflow_instances w join customers c on c.id=w.customer_id
            where c.display_name ilike '%Miladi%' or c.display_name ilike '%Mohamed%'
            order by w.created_at desc limit 10
          """)).mappings().all()
          for r in rows:
              print(dict(r))
          PY
