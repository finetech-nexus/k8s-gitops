name: Check KYC image

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Confirm the KYC pod image and consumer
        run: |
          kubectl -n api get deploy core-api-kyc-api -o jsonpath='image={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
          kubectl -n api get pods -l app.kubernetes.io/instance=core-api -o wide | grep kyc || kubectl -n api get pods | grep kyc
          kubectl -n api logs deploy/core-api-kyc-api --tail=30
