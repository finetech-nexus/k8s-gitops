name: Check Marble roll

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Confirm the rolled images
        run: |
          kubectl -n aml rollout status deploy/marble-api --timeout=180s
          kubectl -n aml rollout status deploy/marble-app --timeout=180s
          kubectl -n aml rollout status deploy/marble-worker --timeout=180s
          kubectl -n aml get deploy marble-api marble-worker -o jsonpath='{range .items[*]}{.metadata.name}={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}{end}'
          kubectl -n aml get deploy marble-app -o jsonpath='marble-app={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
          kubectl -n api get deploy core-api-kyc-api -o jsonpath='kyc={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
