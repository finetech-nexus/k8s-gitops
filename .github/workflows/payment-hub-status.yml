name: Payment Hub status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payment-hub-status.yml'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Point the simulator at the in-cluster rails
        run: |
          echo "===== sibtel-api"
          kubectl get svc,endpoints,pods -n payment-hub -l app=sibtel-api
          echo "===== simulator image before"
          kubectl get deploy ph-ee-simulator -n payment-hub -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "===== minio"
          kubectl get pods -n payment-hub -o wide | grep -i minio || true
          minio_pod=$(kubectl get pods -n payment-hub -o name | grep minio | head -1 || true)
          if [ -n "$minio_pod" ]; then kubectl describe -n payment-hub "$minio_pod" | tail -25 || true; fi
          kubectl set env deployment/ph-ee-simulator -n payment-hub \
            SIBTEL_API_BASE_URL=http://sibtel-api:8095 \
            MT_API_BASE_URL=http://core-api-mt-api.api.svc.cluster.local \
            SWIFT_API_BASE_URL=http://core-api-swift-api.api.svc.cluster.local
          kubectl set image deployment/ph-ee-simulator -n payment-hub \
            ph-ee-simulator=docker.io/nexusbank/ph-ee-simulator:fbc2ac4
          kubectl set image deployment/core-api-card-management-api -n api \
            card-management-api=docker.io/nexusbank/card-management-api:fc0f90e
          kubectl set image deployment/core-api-mt-api -n api \
            mt-api=docker.io/nexusbank/mt-api:31b7e22 \
            wait-for-postgresql=docker.io/library/postgres:16-alpine
          kubectl set image deployment/core-api-swift-api -n api \
            swift-api=docker.io/nexusbank/swift-api:8d862fb \
            wait-for-postgresql=docker.io/library/postgres:16-alpine
          kubectl set image deployment/core-api-core-banking-api -n api \
            core-banking=docker.io/nexusbank/core-banking-api:c2c2ff1
          kubectl set image deployment/nexus-bank-app -n app \
            nexus-bank-app=docker.io/nexusbank/nexus-bank-api:cba2619
          kubectl set image deployment/ph-ee-connector-swift -n payment-hub \
            ph-ee-connector-swift=docker.io/nexusbank/ph-ee-connector-swift:49c385a
          kubectl set image deployment/ph-ee-connector-channel -n payment-hub \
            ph-ee-connector-channel=docker.io/nexusbank/ph-ee-connector-channel:456ef43
          kubectl set env deployment/ph-ee-connector-mt -n payment-hub \
            CARD_API_BASE_URL=http://core-api-card-management-api.api.svc.cluster.local \
            NOTIFICATION_API_BASE_URL=http://core-api-notification-api.api.svc.cluster.local
          ROLLED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          kubectl patch deployment ph-ee-simulator -n payment-hub --type=strategic -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"simulator.nbank.fr/rolled-at\":\"${ROLLED_AT}\"}},\"spec\":{\"containers\":[{\"name\":\"ph-ee-simulator\",\"imagePullPolicy\":\"Always\"}]}}}}"
          kubectl patch deployment ph-ee-connector-mt -n payment-hub --type=strategic -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"connector.nbank.fr/rolled-at\":\"${ROLLED_AT}\"}},\"spec\":{\"containers\":[{\"name\":\"ph-ee-connector-mt\",\"imagePullPolicy\":\"Always\"}]}}}}"
          kubectl patch deployment ph-ee-connector-channel -n payment-hub --type=strategic -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"channel.nbank.fr/rolled-at\":\"${ROLLED_AT}\"}},\"spec\":{\"containers\":[{\"name\":\"ph-ee-connector-channel\",\"imagePullPolicy\":\"Always\"}]}}}}"
          kubectl patch deployment ph-ee-connector-swift -n payment-hub --type=strategic -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"connector.nbank.fr/rolled-at\":\"${ROLLED_AT}\"}},\"spec\":{\"containers\":[{\"name\":\"ph-ee-connector-swift\",\"imagePullPolicy\":\"Always\"}]}}}}"
          kubectl rollout status deployment/ph-ee-simulator -n payment-hub --timeout=180s
          kubectl rollout status deployment/ph-ee-connector-mt -n payment-hub --timeout=180s
          kubectl rollout status deployment/ph-ee-connector-channel -n payment-hub --timeout=180s
          kubectl rollout status deployment/ph-ee-connector-swift -n payment-hub --timeout=180s
          kubectl rollout status deployment/core-api-card-management-api -n api --timeout=180s
          if ! kubectl rollout status deployment/core-api-mt-api -n api --timeout=180s; then
            echo "===== mt-api stuck"
            kubectl get pods -n api -o wide
            kubectl describe deploy core-api-mt-api -n api | tail -50
            for p in $(kubectl get pods -n api -o name | grep core-api-mt-api); do
              echo "-- $p"
              kubectl describe -n api "$p" | tail -40
              kubectl logs -n api "$p" --all-containers --tail=60 || true
            done
            exit 1
          fi
          kubectl rollout status deployment/core-api-swift-api -n api --timeout=180s
          kubectl rollout status deployment/core-api-core-banking-api -n api --timeout=180s
          kubectl rollout status deployment/nexus-bank-app -n app --timeout=180s
          echo "===== simulator env"
          kubectl get deploy ph-ee-simulator -n payment-hub -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}'
          echo "===== files"
          kubectl run sibtel-files --rm -i --restart=Never -n payment-hub --image=curlimages/curl:8.10.1 --command -- curl -sS -m 15 -w "\nhttp %{http_code}\n" http://sibtel-api:8095/api/files || true
          echo "===== card issue route"
          kubectl run sim-cards --rm -i --restart=Never -n payment-hub --image=curlimages/curl:8.10.1 --command -- curl -sS -m 20 -o /dev/null -w "simulate/mt/cards http %{http_code}\n" -X POST http://ph-ee-simulator:8090/simulate/mt/cards -H 'Content-Type: application/json' -d '{"holderName":"Probe","scheme":"VISA","tenantId":"tn","productId":"probe"}' || true
          echo "===== zeebe exporter mapping"
          kubectl run es-mapping --rm -i --restart=Never -n payment-hub --image=curlimages/curl:8.10.1 --command -- sh -c 'es=http://infra-elasticsearch.infra.svc.cluster.local:9200; curl -sS -m 20 "$es/_cat/indices/zeebe-record*?h=index" | while read -r idx; do [ -z "$idx" ] && continue; echo "-- $idx"; curl -sS -m 20 -X POST "$es/$idx/_close"; echo; curl -sS -m 20 -X PUT "$es/$idx/_settings" -H "Content-Type: application/json" -d "{\"index.mapping.ignore_malformed\":true}"; echo; curl -sS -m 20 -X POST "$es/$idx/_open"; echo; done' || true
