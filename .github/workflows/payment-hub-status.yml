name: Payment Hub status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payment-hub-status.yml'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Roll the Tunisia simulator onto the published image
        run: |
          echo "===== helm"
          kubectl get helmrelease payment-hub -n payment-hub -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}{"\n"}' || true
          echo "===== minio"
          kubectl get deploy minio -n payment-hub -o jsonpath='ready={.status.readyReplicas}/{.status.replicas} updated={.status.updatedReplicas}{"\n"}' || true
          kubectl patch deployment ph-ee-simulator -n payment-hub --type=strategic -p '{"spec":{"template":{"metadata":{"annotations":{"deployed-at":"2026-10-14T13:45:00Z"}},"spec":{"containers":[{"name":"ph-ee-simulator","imagePullPolicy":"Always"}]}}}}'
          kubectl rollout status deployment/ph-ee-simulator -n payment-hub --timeout=180s
          kubectl get deploy ph-ee-simulator -n payment-hub -o jsonpath='pull={.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'
          kubectl get pods -n payment-hub -l app=ph-ee-simulator -o wide
