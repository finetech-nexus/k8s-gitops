name: Reconcile — aml

on:
  push:
    branches: [main]
    paths:
      - 'apps/aml/**'
      - 'clusters/dev/aml.yaml'
      - '.github/workflows/reconcile-aml.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Install the OpenSanctions API key
        env:
          OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}
        run: |
          test -n "$OPENSANCTIONS_API_KEY"
          kubectl -n aml create secret generic marble-opensanctions \
            --from-literal=api-key="$OPENSANCTIONS_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Reconcile Git source and Marble
        run: |
          set +e
          flux reconcile source git flux-system -n flux-system --timeout=2m
          flux reconcile kustomization aml -n flux-system --with-source --timeout=8m
          echo "===== kustomization ====="
          kubectl -n flux-system get kustomization aml -o yaml
          echo "===== pods ====="
          kubectl -n aml get pods,jobs -o wide
          echo "===== api logs ====="
          kubectl -n aml logs -l app=marble-api --tail=60 --prefix
          echo "===== app logs ====="
          kubectl -n aml logs deploy/marble-app -c app --tail=40
          echo "===== proxy logs ====="
          kubectl -n aml logs deploy/marble-app -c proxy --tail=40
          echo "===== init logs ====="
          kubectl -n aml exec marble-postgresql-0 -- sh -c 'psql -U "$POSTGRES_USER" -d marble -c "SELECT to_regclass('\''marble.api_keys'\'') AS api_keys, to_regclass('\''marble.users'\'') AS users"'
          kubectl -n aml wait --for=condition=complete job/marble-migrations-v14 --timeout=180s
          kubectl -n aml logs job/marble-migrations-v14 --tail=40
          kubectl -n aml wait --for=condition=complete job/marble-init-aml-21 --timeout=240s
          kubectl -n aml logs job/marble-init-aml-21 --tail=80
          kubectl -n aml wait --for=condition=complete job/marble-check-user-3 --timeout=180s
          kubectl -n aml logs job/marble-check-user-3 --tail=20
          kubectl -n aml wait --for=condition=complete job/marble-feature-access-1 --timeout=180s
          kubectl -n aml logs job/marble-feature-access-1
          kubectl -n aml logs deploy/marble-worker --tail=40
          exit 0
