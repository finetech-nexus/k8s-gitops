name: Verify observability
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Inject level and verify
        run: |
          set +e
          python3 apps/logging/scripts/inject_level.py
          kubectl rollout restart ds/fluent-bit-tn -n logging
          sleep 25
          kubectl rollout restart deploy/kube-prometheus-stack-grafana -n monitoring
          sleep 20
          GF=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}')
          AUTH=$(printf 'admin:grafanaSandb0x' | base64 | tr -d '\n')
          echo "===== dashboards ====="
          kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" \
            'http://127.0.0.1:3000/api/search?type=dash-db' | tr ',' '\n' | grep '"title"' | head -40
          echo "===== rules ====="
          kubectl get prometheusrule -n monitoring
          echo "===== app/api counts + level sample ====="
          kubectl delete pod v-obs -n infra --ignore-not-found --wait=false
          sleep 2
          kubectl run v-obs --rm -i --restart=Never -n infra --image=curlimages/curl:8.10.1 -- sh -c '
            AUTH=elastic:elasticSearchPas42
            for a in logs-ns-app logs-ns-api; do echo -n "$a "; curl -sf -u $AUTH http://infra-elasticsearch:9200/$a/_count; echo; done
            curl -sf -u $AUTH "http://infra-elasticsearch:9200/logs-tn-*/_search?size=2&sort=@timestamp:desc&_source=level,message,k8s_namespace_name"
          '
