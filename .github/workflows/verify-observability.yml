name: Verify observability
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Verify logs + metrics paths
        run: |
          set +e
          # Ensure Flux values land: restart grafana after ConfigMap/secret refresh
          kubectl annotate helmrelease -n monitoring kube-prometheus-stack reconcile.fluxcd.io/requestedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite || true
          kubectl rollout restart deploy/kube-prometheus-stack-grafana -n monitoring || true
          sleep 20
          kubectl rollout status deploy/kube-prometheus-stack-grafana -n monitoring --timeout=3m || true

          echo "===== PODS ====="
          kubectl get pods -n infra | grep -iE 'elastic|kibana'
          kubectl get pods -n monitoring | grep -iE 'prometheus|grafana|business'
          kubectl get pods -n logging | grep fluent

          echo "===== ES ====="
          kubectl delete pod v-es -n infra --ignore-not-found --wait=false
          sleep 2
          kubectl run v-es --rm -i --restart=Never -n infra --image=curlimages/curl:8.10.1 -- sh -c '
            AUTH=elastic:elasticSearchPas42
            curl -sf -u $AUTH -X PUT "http://infra-elasticsearch:9200/.kibana*/_settings" -H "Content-Type: application/json" -d "{\"index\":{\"number_of_replicas\":0}}" || true
            curl -sf -u $AUTH "http://infra-elasticsearch:9200/_cluster/health?pretty"
            echo
            curl -sf -u $AUTH "http://infra-elasticsearch:9200/logs-tn-*/_count"; echo
            curl -sf -u $AUTH "http://infra-elasticsearch:9200/logs-tn-*/_search?size=1&sort=@timestamp:desc" | head -c 1200; echo
          '

          echo "===== PROM ====="
          PROM=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].metadata.name}')
          echo "prom=$PROM"
          kubectl get pod -n monitoring "$PROM" -o wide
          kubectl exec -n monitoring "$PROM" -c prometheus -- wget -qO- 'http://127.0.0.1:9090/-/ready'
          echo
          kubectl exec -n monitoring "$PROM" -c prometheus -- wget -qO- 'http://127.0.0.1:9090/api/v1/query?query=count(up)'
          echo
          kubectl exec -n monitoring "$PROM" -c prometheus -- wget -qO- 'http://127.0.0.1:9090/api/v1/query?query=business_exporter_up%20or%20up{job="business-exporter"}'
          echo

          echo "===== GRAFANA DS (basic auth header) ====="
          GF=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}')
          AUTH=$(printf 'admin:grafanaSandb0x' | base64 | tr -d '\n')
          kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" http://127.0.0.1:3000/api/datasources
          echo
          echo "--- Prometheus query via Grafana ---"
          # Discover prometheus datasource uid/id
          DS=$(kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" http://127.0.0.1:3000/api/datasources)
          echo "$DS" | head -c 2500; echo
          # Try proxy by name path
          kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" \
            --header='Content-Type: application/json' \
            --post-data='{"queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"count(up)","instant":true}],"from":"now-5m","to":"now"}' \
            http://127.0.0.1:3000/api/ds/query | head -c 1500
          echo
          echo "--- ES Logs-TN via Grafana ---"
          kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" \
            'http://127.0.0.1:3000/api/datasources/proxy/uid/Logs-TN/_cluster/health' 2>&1 | head -c 500
          echo
          # Fallback: find Logs-TN id
          kubectl exec -n monitoring "$GF" -c grafana -- wget -qO- --header="Authorization: Basic $AUTH" \
            'http://127.0.0.1:3000/api/datasources/name/Logs-TN' 2>&1 | head -c 800
          echo
