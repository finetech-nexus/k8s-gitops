name: Reconcile — ingress-nginx

on:
  push:
    branches: [main]
    paths: ['apps/ingress-nginx/**', 'apps/overlays/**', 'clusters/**', '.github/workflows/reconcile-ingress-nginx.yml']
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Reconcile Kustomization — ingress-nginx
        run: flux reconcile kustomization ingress-nginx -n flux-system --timeout=3m || true
