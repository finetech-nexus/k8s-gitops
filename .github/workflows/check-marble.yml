name: Check Marble ingest

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Inspect publish, consume, and a live ingest
        run: |
          set +e
          echo '## deploys'
          kubectl -n api get deploy core-api-kyc-api core-api-core-banking-api -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas,DESIRED:.spec.replicas'
          echo '## helm suspend'
          kubectl -n api get helmrelease core-api -o jsonpath='suspend={.spec.suspend}{"\n"}'
          echo '## kyc env'
          kubectl -n api exec deploy/core-api-kyc-api -- printenv | awk -F= '/^(MARBLE_API_URL|KAFKA_BROKERS|KAFKA_TRANSACTION_TOPIC|KAFKA_GROUP_ID|COUNTRY_CODE|DEFAULT_CURRENCY)=/{print}'
          echo '## banking env'
          kubectl -n api exec deploy/core-api-core-banking-api -- printenv | awk -F= '/^(KAFKA_BROKERS|KAFKA_TRANSACTION_TOPIC|TENANT|COUNTRY_CODE|DEFAULT_CURRENCY)=/{print}'
          echo '## kyc marble logs'
          kubectl -n api logs deploy/core-api-kyc-api --since=3h | awk 'BEGIN{IGNORECASE=1} /marble|kafka|ingest|decision/ {print}' | tail -n 80
          echo '## banking marble logs'
          kubectl -n api logs deploy/core-api-core-banking-api --since=3h | awk 'BEGIN{IGNORECASE=1} /marble|kafka|onboarding completed|transfer\/request/ {print}' | tail -n 80
          echo '## kyc pods'
          kubectl -n api get pods -o wide | awk '/kyc-api/'
          for pod in $(kubectl -n api get pods -o name | awk '/kyc-api/'); do
            echo "### $pod"
            kubectl -n api logs "$pod" --tail=50
          done
