name: Diagnose — activate-account
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Map Fineract client 8 to Clarity customer
        run: |
          set +e
          echo '=== Mohamed Miladi full context + hook ==='
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import os, json
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          cust = db.execute(text("select * from customers where display_name='Mohamed Miladi'")).mappings().first()
          print("CUSTOMER", {k: cust[k] for k in cust.keys() if k != 'id' or True})
          wfs = db.execute(text("select id, definition_key, state, status, context from workflow_instances where customer_id=:cid order by created_at desc"), {"cid": cust["id"]}).mappings().all()
          for w in wfs:
            ctx = w["context"]
            if isinstance(ctx, str):
              try: ctx = json.loads(ctx)
              except Exception: pass
            hook = (ctx or {}).get("account_hook") if isinstance(ctx, dict) else None
            entity = (ctx or {}).get("entity") if isinstance(ctx, dict) else None
            print("WF", w["id"], w["definition_key"], w["state"], "hook", json.dumps(hook, default=str)[:800] if hook else None)
            print("  entity.id", (entity or {}).get("id") if isinstance(entity, dict) else None)
            print("  entity.data keys", list(((entity or {}).get("data") or {}).keys()) if isinstance(entity, dict) else None)
          tx = db.execute(text("select payload from transactions where correlation_id='deposit:232'")).mappings().first()
          print("DEPOSIT_PAYLOAD", json.dumps(tx["payload"] if isinstance(tx["payload"], dict) else json.loads(tx["payload"]), default=str))
          PY
          echo '=== fineract / core-banking client 8 ==='
          kubectl -n core-banking get pods 2>/dev/null | head -20
          for ns in core-banking banking fineract api; do
            kubectl -n $ns get deploy 2>/dev/null | grep -iE 'fineract|core-banking|ledger' | head -10
          done
          # try resolve client 8 via core-banking-api if present
          kubectl -n api get deploy 2>/dev/null | head -40
          kubectl -n api logs deploy/core-api-kyc-api --since=3h --tail=400 2>/dev/null | grep -iE 'deposit:232|"clientId":.?8|clientId.:8|accountId' | tail -40
