name: Diagnose — activate-account
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Prove Fineract client 8 identity
        run: |
          set +e
          echo '=== Clarity: who has external_ref containing 8 / user-6cbff ==='
          kubectl -n kyc-aml exec -i deploy/clarity-api -- python - <<'PY'
          import os, json
          os.chdir("/srv/clarity/backend")
          from app.config import Settings, bind_settings, reset_runtime_overlay
          from app.db import Database
          from sqlalchemy import text
          reset_runtime_overlay(); bind_settings(Settings())
          db = Database(Settings().database_url).session_factory()
          print("match_external_ref_8", [dict(r) for r in db.execute(text("select id, display_name, external_ref, canonical_status from customers where external_ref in ('8','client:8')")).mappings()])
          print("miladi", dict(db.execute(text("select id, display_name, external_ref, canonical_status from customers where display_name='Mohamed Miladi'")).mappings().first() or {}))
          tx = db.execute(text("select id, customer_id, correlation_id, amount, direction, payload from transactions where correlation_id='deposit:232'")).mappings().first()
          print("tx_customer_id_linked", tx["customer_id"] if tx else None)
          print("tx_payload_customer_id", (tx["payload"] or {}).get("customer_id") if tx and isinstance(tx["payload"], dict) else None)
          print("tx_payload_client_id", (tx["payload"] or {}).get("client_id") if tx and isinstance(tx["payload"], dict) else None)
          print("tx_payload_account", (tx["payload"] or {}).get("credit_account_id") if tx and isinstance(tx["payload"], dict) else None)
          # hook response body if any
          row = db.execute(text("select context from workflow_instances where id='72fdd14e-29c8-4e02-854b-9ab7d84f4eba'")).mappings().first()
          ctx = row["context"]
          if isinstance(ctx, str): ctx = json.loads(ctx)
          hook = (ctx or {}).get("account_hook") or {}
          print("hook_status", hook.get("status"), "hook_response_head", str(hook.get("response"))[:1000])
          print("hook_error", hook.get("error"))
          PY
          echo '=== Fineract MySQL client id 8 ==='
          kubectl -n core-banking exec fineract-mysql-0 -- mysql -N -ufineract -pfineract fineract_default -e "SELECT id, external_id, display_name, firstname, lastname, mobile_no, email_address, status_enum FROM m_client WHERE id=8\G" 2>/dev/null || \
          kubectl -n core-banking exec fineract-mysql-0 -- mysql -N -uroot -pshola -e "SELECT id, external_id, display_name, firstname, lastname FROM fineract_default.m_client WHERE id=8\G" 2>/dev/null || \
          kubectl -n core-banking exec fineract-mysql-0 -- sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES; SELECT id, external_id, display_name, firstname, lastname FROM fineract_tenants.tenants LIMIT 5;"' 2>&1 | tail -40
          echo '=== Fineract savings account 10 ==='
          kubectl -n core-banking exec fineract-mysql-0 -- sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT id, account_no, client_id, product_id, status_enum FROM fineract_default.m_savings_account WHERE id=10\G"' 2>&1 | tail -30
