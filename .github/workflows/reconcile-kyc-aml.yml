name: Reconcile — kyc-aml

on:
  push:
    branches: [main]
    paths:
      - 'apps/kyc-aml/**'
      - 'clusters/dev/kyc-aml.yaml'
      - 'clusters/dev/kustomization.yaml'
      - '.github/workflows/reconcile-kyc-aml.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Read the final submit
        run: |
          set -o pipefail
          kubectl -n api logs deploy/core-api-kyc-api --since=6h > /tmp/kyc.log
          wc -l /tmp/kyc.log
          echo "final $(grep -c 'Processing final' /tmp/kyc.log || true)"
          echo "ml-error $(grep -c 'Error processing final' /tmp/kyc.log || true)"
          echo "missing $(grep -c 'Missing required' /tmp/kyc.log || true)"
          echo "video $(grep -c 'Video check' /tmp/kyc.log || true)"
          echo "calling $(grep -c 'Calling Python ML backend for verification' /tmp/kyc.log || true)"
          grep -E 'Processing final|Error processing final|Missing required|Video check|Calling Python ML backend for verification|ML Backend Response' /tmp/kyc.log | tail -30
          echo "--- clarity ---"
          kubectl -n kyc-aml logs deploy/clarity-api --since=6h > /tmp/clarity.log
          wc -l /tmp/clarity.log
          grep -E 'kyc/verify|POST /api' /tmp/clarity.log | tail -30
      - name: Apply Clarity
        run: |
          set +e
          flux reconcile source git flux-system -n flux-system --timeout=2m
          flux reconcile kustomization flux-system -n flux-system --timeout=2m
          kubectl apply -k apps/kyc-aml/base
          kubectl -n kyc-aml delete statefulset clarity-postgresql --ignore-not-found
          kubectl -n kyc-aml delete pod -l app=clarity-postgresql --ignore-not-found --force --grace-period=0
          kubectl -n kyc-aml rollout restart deploy/clarity-api deploy/clarity-web
          kubectl -n kyc-aml rollout status deploy/clarity-api --timeout=300s
          api=$?
          kubectl -n kyc-aml rollout status deploy/clarity-web --timeout=180s
          web=$?
          echo "===== resources ====="
          kubectl -n kyc-aml get pods,svc,ingress -o wide
          echo "===== api ====="
          kubectl -n kyc-aml logs deploy/clarity-api --tail=40
          test "$api" = 0 -a "$web" = 0
