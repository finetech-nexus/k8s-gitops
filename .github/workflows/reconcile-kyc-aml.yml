name: Reconcile — kyc-aml

on:
  push:
    branches: [main]
    paths:
      - 'apps/kyc-aml/**'
      - 'clusters/dev/kyc-aml.yaml'
      - 'clusters/dev/kustomization.yaml'
      - '.github/workflows/reconcile-kyc-aml.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Trace the photo check
        run: |
          kubectl -n api logs deploy/core-api-kyc-api --tail=200 | python3 -c 'import sys
          keys=("final","ML Backend","verification","Error","error","400","Calling")
          for line in sys.stdin:
            if any(k in line for k in keys):
              print(line[:500], end="")'
          echo "--- clarity ---"
          kubectl -n kyc-aml logs deploy/clarity-api --tail=120 | python3 -c 'import sys
          for line in sys.stdin:
            if "kyc/verify" in line or "liveness" in line or "400" in line or "ERROR" in line:
              print(line[:500], end="")'
          kubectl -n api exec deploy/core-api-kyc-api -- node -e 'const http=require("http"); const b=Buffer.from("x"); const boundary="----c"; const body=Buffer.concat([Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"id_document\"; filename=\"a.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n"), b, Buffer.from("\r\n--"+boundary+"\r\nContent-Disposition: form-data; name=\"selfie_image\"; filename=\"b.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n"), b, Buffer.from("\r\n--"+boundary+"--\r\n")]); const req=http.request({hostname:"clarity-api.kyc-aml.svc.cluster.local", port:8095, path:"/api/v1/kyc/verify", method:"POST", headers:{"content-type":"multipart/form-data; boundary="+boundary, "content-length":body.length}}, res=>{let d=""; res.on("data", c=>d+=c); res.on("end", ()=>console.log(res.statusCode, d.slice(0,300)));}); req.on("error", e=>console.log("ERR", e.message)); req.end(body);'
      - name: Apply Clarity
        run: |
          set +e
          flux reconcile source git flux-system -n flux-system --timeout=2m
          flux reconcile kustomization flux-system -n flux-system --timeout=2m
          kubectl apply -k apps/kyc-aml/base
          kubectl -n kyc-aml delete statefulset clarity-postgresql --ignore-not-found
          kubectl -n kyc-aml delete pod -l app=clarity-postgresql --ignore-not-found --force --grace-period=0
          kubectl -n kyc-aml rollout restart deploy/clarity-api deploy/clarity-web
          kubectl -n kyc-aml rollout status deploy/clarity-api --timeout=300s
          api=$?
          kubectl -n kyc-aml rollout status deploy/clarity-web --timeout=180s
          web=$?
          echo "===== resources ====="
          kubectl -n kyc-aml get pods,svc,ingress -o wide
          echo "===== api ====="
          kubectl -n kyc-aml logs deploy/clarity-api --tail=40
          test "$api" = 0 -a "$web" = 0
