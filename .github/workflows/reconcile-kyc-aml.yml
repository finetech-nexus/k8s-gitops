name: Reconcile — kyc-aml

on:
  push:
    branches: [main]
    paths:
      - 'apps/kyc-aml/**'
      - 'clusters/dev/kyc-aml.yaml'
      - 'clusters/dev/kustomization.yaml'
      - '.github/workflows/reconcile-kyc-aml.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Reconcile Clarity
        run: |
          flux reconcile source git flux-system -n flux-system --timeout=2m
          flux reconcile kustomization flux-system -n flux-system --timeout=5m
          flux reconcile kustomization kyc-aml -n flux-system --with-source --timeout=10m
      - name: Wait for Clarity
        run: |
          kubectl -n kyc-aml rollout status statefulset/clarity-postgresql --timeout=180s
          kubectl -n kyc-aml rollout status deploy/clarity-api --timeout=300s
          kubectl -n kyc-aml rollout status deploy/clarity-web --timeout=300s
          kubectl -n kyc-aml get pods,svc,ingress -o wide
          kubectl -n kyc-aml logs deploy/clarity-api --tail=40
