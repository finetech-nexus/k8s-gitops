name: Reconcile — cert-manager

on:
  push:
    branches: [main]
    paths: ['apps/cert-manager*/**', 'apps/overlays/**', 'clusters/**', '.github/workflows/reconcile-cert-manager.yml']
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Reconcile Kustomizations — cert-manager
        run: |
          flux reconcile kustomization cert-manager -n flux-system --timeout=3m || true
          flux reconcile kustomization cert-manager-issuers -n flux-system --timeout=3m || true
