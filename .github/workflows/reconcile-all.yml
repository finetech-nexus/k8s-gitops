# Run all per-app reconciles in parallel. Trigger after validate or manually.
name: Reconcile all

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        app:
          - sources
          - cert-manager
          - ingress-nginx
          - platform
          - infra
          - iam
          - core-banking
          - payment-hub
          - api
          - app
          - kyc
          - kong
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Reconcile — ${{ matrix.app }}
        run: |
          set -e
          APP="${{ matrix.app }}"
          if [ "$APP" = "sources" ]; then
            flux reconcile source git flux-system -n flux-system
            flux reconcile kustomization flux-system -n flux-system --timeout=5m
            flux reconcile kustomization sources -n flux-system --timeout=3m || true
          elif [ "$APP" = "cert-manager" ]; then
            flux reconcile kustomization cert-manager -n flux-system --timeout=3m || true
            flux reconcile kustomization cert-manager-issuers -n flux-system --timeout=3m || true
          elif [ "$APP" = "ingress-nginx" ]; then
            flux reconcile kustomization ingress-nginx -n flux-system --timeout=3m || true
          elif [ "$APP" = "platform" ]; then
            flux resume kustomization platform -n flux-system || true
            flux reconcile kustomization platform -n flux-system --timeout=3m || true
          elif [ "$APP" = "infra" ]; then
            flux reconcile kustomization infra -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n infra --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n infra --timeout=3m || true; done
          elif [ "$APP" = "iam" ]; then
            flux reconcile kustomization iam -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n iam --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n iam --timeout=3m || true; done
          elif [ "$APP" = "core-banking" ]; then
            flux reconcile kustomization core-banking -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n core-banking --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n core-banking --timeout=3m || true; done
          elif [ "$APP" = "payment-hub" ]; then
            flux reconcile kustomization payment-hub -n flux-system --timeout=10m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n payment-hub --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n payment-hub --timeout=15m || true; done
          elif [ "$APP" = "api" ]; then
            flux reconcile kustomization apis -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n api --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n api --timeout=3m || true; done
          elif [ "$APP" = "app" ]; then
            flux reconcile kustomization app -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n app --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n app --timeout=3m || true; done
          elif [ "$APP" = "kyc" ]; then
            flux reconcile kustomization kyc -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n kyc --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n kyc --timeout=3m || true; done
          elif [ "$APP" = "kong" ]; then
            flux reconcile kustomization kong -n flux-system --timeout=5m || true
            flux reconcile kustomization kong-routes -n flux-system --timeout=3m || true
            for name in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -n apim --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do flux reconcile helmrelease "$name" -n apim --timeout=5m || true; done
          fi
