name: Inject log level
on:
  workflow_dispatch:
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Patch functional.lua and verify
        run: |
          set -euo pipefail
          kubectl get cm -n logging -o json | python3 -c '
          import json, subprocess, sys
          data = json.load(sys.stdin)
          sn = """            local lvl = record[\"level\"] or record[\"severity\"] or record[\"log_level\"] or record[\"LEVEL\"]
            if lvl == nil or lvl == \"\" then
                local msg = string.upper(tostring(record[\"message\"] or \"\"))
                if string.find(msg, \"FATAL\", 1, true) or string.find(msg, \"CRITICAL\", 1, true) then lvl = \"fatal\"
                elseif string.find(msg, \"ERROR\", 1, true) or string.find(msg, \" ERR\", 1, true) then lvl = \"error\"
                elseif string.find(msg, \"WARN\", 1, true) then lvl = \"warn\"
                elseif string.find(msg, \"DEBUG\", 1, true) then lvl = \"debug\"
                elseif string.find(msg, \"INFO\", 1, true) then lvl = \"info\"
                else lvl = \"unknown\" end
            else lvl = string.lower(tostring(lvl)) end
            record[\"level\"] = lvl
"""
          for item in data["items"]:
              lua = (item.get("data") or {}).get("functional.lua")
              if not lua:
                  continue
              name = item["metadata"]["name"]
              if "record[\"level\"]" in lua:
                  print(name, "already ok")
                  continue
              if "return 1, timestamp, record" not in lua:
                  print(name, "skip")
                  continue
              new = lua.replace("return 1, timestamp, record", sn + "\n            return 1, timestamp, record", 1)
              payload = {
                  "apiVersion": "v1",
                  "kind": "ConfigMap",
                  "metadata": {"name": name, "namespace": "logging"},
                  "data": {**item["data"], "functional.lua": new},
              }
              p = subprocess.run(["kubectl", "apply", "-f", "-"], input=json.dumps(payload).encode(), capture_output=True)
              print(name, p.returncode, p.stdout.decode(), p.stderr.decode())
          '
          kubectl rollout restart ds/fluent-bit-tn -n logging
          kubectl rollout status ds/fluent-bit-tn -n logging --timeout=3m
          sleep 35
          kubectl delete pod v-lvl -n infra --ignore-not-found --wait=false
          sleep 2
          kubectl run v-lvl --rm -i --restart=Never -n infra --image=curlimages/curl:8.10.1 -- \
            sh -c 'curl -sf -u elastic:elasticSearchPas42 "http://infra-elasticsearch:9200/logs-tn-*/_search?size=3&sort=@timestamp:desc&_source=level,message,k8s_namespace_name"'
