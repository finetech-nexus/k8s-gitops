name: Reconcile — platform

on:
  push:
    branches: [main]
    paths: ['apps/overlays/dev/01-platform/**', 'clusters/**', '.github/workflows/reconcile-platform.yml']
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Install Flux CLI
        run: curl -sSL https://fluxcd.io/install.sh | bash && flux version
      - name: Resume and Reconcile — platform
        run: |
          flux resume kustomization platform -n flux-system || true
          flux reconcile kustomization platform -n flux-system --timeout=3m || true
