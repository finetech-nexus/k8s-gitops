name: Read KYC logs

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Pod status
        run: |
          kubectl -n kyc-aml get pods -o wide
          echo "--- api describe ---"
          kubectl -n kyc-aml describe pod -l app=clarity-api | sed -n '/Status:/,/^Events/p;/Events/,$p'
          echo "--- nodes ---"
          kubectl get nodes
          kubectl describe nodes | sed -n '/Allocated resources/,/Events/p'
          echo "--- api kyc ---"
          kubectl -n api get pods | grep kyc || true
      - name: Upstream targets
        run: |
          set +e
          kubectl -n api exec deploy/core-api-kyc-api -- printenv BALLERINE_ENDPOINT MARBLE_API_URL ML_BACKEND_URL
          echo "--- clarity model route ---"
          kubectl -n api exec deploy/core-api-kyc-api -- node -e 'fetch("http://clarity-api.kyc-aml.svc.cluster.local:8095/api/v1/liveness/detect",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(async (r)=>{console.log(r.status); console.log((await r.text()).slice(0,180))})'
          echo "--- clarity ballerine health ---"
          kubectl -n api exec deploy/core-api-kyc-api -- node -e 'fetch("http://clarity-api.kyc-aml.svc.cluster.local:8095/api/v1/_health/live").then(async (r)=>{console.log(r.status)})'
      - name: AI reader
        run: |
          set +e
          kubectl -n api get deploy core-api-ai-api -o jsonpath='image={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
          kubectl -n api get pods -l app.kubernetes.io/instance=core-api -o wide | grep ai-api || kubectl -n api get pods | grep ai-api || true
          kubectl -n api logs deploy/core-api-ai-api --since=20m --tail=120
      - name: KYC service lines
        run: |
          set +e
          kubectl -n api logs deploy/core-api-kyc-api --since=25m --tail=500 > /tmp/kyc.log
          echo "kyc-lines $(wc -l < /tmp/kyc.log)"
          grep -nE "Processing final|Liveness pass|Rejected final|Calling Python|Error processing|Error calling|ECONNREFUSED|Failed to process|verification|simulator|ML backend|Video check|Missing required|No documents" /tmp/kyc.log || true
      - name: Clarity lines
        run: |
          set +e
          kubectl -n kyc-aml logs deploy/clarity-api --since=25m --tail=400 > /tmp/clarity.log
          echo "clarity-lines $(wc -l < /tmp/clarity.log)"
          grep -nE "ERROR|Exception|liveness|kyc/verify|kyc/ocr| 4[0-9][0-9] | 5[0-9][0-9] " /tmp/clarity.log || true
          echo "=== clarity tail ==="
          tail -60 /tmp/clarity.log
