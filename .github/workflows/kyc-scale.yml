name: Restore KYC

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Show KYC and Kafka status
        run: |
          kubectl -n api get deploy core-api-kyc-api -o jsonpath='{.spec.template.spec.containers[0].image}{" ready="}{.status.readyReplicas}{"\n"}'
          kubectl -n infra get pod kafka-broker-0 --no-headers
          kubectl -n api logs deploy/core-api-kyc-api --tail=30
