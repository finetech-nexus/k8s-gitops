name: Apply Kibana namespace views
on: workflow_dispatch
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Run data-views job
        run: |
          set -euo pipefail
          kubectl delete job -n logging kibana-data-views-v3 --ignore-not-found
          kubectl delete job -n logging kibana-data-views-v4 --ignore-not-found
          kubectl delete job -n logging kibana-data-views-v5 --ignore-not-found
          kubectl apply -f apps/logging/kibana-data-views-job.yaml
          kubectl wait -n logging --for=condition=complete job/kibana-data-views-v5 --timeout=5m
          kubectl logs -n logging job/kibana-data-views-v5 2>/dev/null | tr "}" "\n" | grep -E "alias |data_view |search |verify|ready|FAILED" | head -80 || true
