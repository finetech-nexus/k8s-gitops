name: Replay Marble consumer

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Replay stored transaction events into Marble
        run: |
          set -e
          echo '## image'
          kubectl -n api get deploy core-api-kyc-api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl -n api rollout status deploy/core-api-kyc-api --timeout=180s
          kubectl -n api scale deploy/core-api-kyc-api --replicas=0
          sleep 15
          echo '## reset offsets on the broker'
          kubectl -n infra exec kafka-broker-0 -- \
            /opt/bitnami/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 \
            --group kyc-marble --topic notification.transaction --reset-offsets --to-earliest --execute
          kubectl -n api scale deploy/core-api-kyc-api --replicas=1
          kubectl -n api rollout status deploy/core-api-kyc-api --timeout=180s
          sleep 20
          kubectl -n api logs deploy/core-api-kyc-api --tail=80
