# Validate GitOps manifests and optionally trigger Flux reconcile on push to main.
# - Validate: kustomize build all paths (always on push + PR).
# - Reconcile: flux reconcile (only on push to main when KUBE_CONFIG is set).
name: Validate and Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION="5.8.1"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/kustomize
          kustomize version

      - name: Build cluster config (clusters/dev)
        run: kustomize build clusters/dev >/dev/null

      - name: Build app paths
        run: |
          set -e
          for path in \
            apps/sources \
            apps/cert-manager-install \
            apps/cert-manager \
            apps/kong \
            apps/kong-ingress \
            apps/monitoring \
            apps/overlays/dev/01-platform \
            apps/overlays/dev/02-identity \
            apps/overlays/dev/03-core \
            apps/overlays/dev/04-apis \
            apps/overlays/staging \
            apps/overlays/production \
            ; do
            echo "Building $path..."
            kustomize build "$path" >/dev/null
          done
          echo "All kustomize builds succeeded."

  # Trigger Flux to pull latest commit and reconcile. Runs only on push to main when KUBE_CONFIG secret is set.
  reconcile:
    needs: kustomize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install Flux CLI
        run: |
          curl -sSL https://fluxcd.io/install.sh | bash
          flux version

      - name: Reconcile Flux
        run: |
          flux reconcile source git flux-system -n flux-system --with-source
          flux reconcile kustomization flux-system -n flux-system --timeout=5m
