# Validate GitOps manifests and optionally trigger Flux reconcile on push to main.
# - Validate: kustomize build all paths (always on push + PR).
# - Reconcile: flux reconcile (only on push to main when KUBE_CONFIG is set).
name: Validate and Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION="5.8.1"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/kustomize
          kustomize version

      - name: Build cluster config (clusters/dev)
        run: kustomize build clusters/dev >/dev/null

      - name: Build app paths
        run: |
          set -e
          for path in \
            apps/sources \
            apps/cert-manager-install \
            apps/cert-manager \
            apps/ingress-nginx \
            apps/kong \
            apps/overlays/dev/01-platform \
            apps/overlays/dev/06-infra \
            apps/overlays/dev/02-identity \
            apps/overlays/dev/03-core \
            apps/overlays/dev/04-apis \
            apps/overlays/dev/05-app \
            apps/overlays/staging \
            apps/overlays/production \
            ; do
            echo "Building $path..."
            kustomize build "$path" >/dev/null
          done
          echo "All kustomize builds succeeded."

  # Trigger Flux to pull latest commit and reconcile. Runs only on push to main. Requires KUBE_CONFIG secret to be set.
  reconcile:
    needs: kustomize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install Flux CLI
        run: |
          curl -sSL https://fluxcd.io/install.sh | bash
          flux version

      - name: Reconcile Flux source and root
        run: |
          flux reconcile source git flux-system -n flux-system
          flux reconcile kustomization flux-system -n flux-system --timeout=5m

      - name: Resume suspended Kustomizations
        run: |
          for name in platform; do
            flux resume kustomization "$name" -n flux-system || true
          done

      - name: Reconcile Kustomization — sources
        run: flux reconcile kustomization sources -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — cert-manager
        run: flux reconcile kustomization cert-manager -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — cert-manager-issuers
        run: flux reconcile kustomization cert-manager-issuers -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — ingress-nginx
        run: flux reconcile kustomization ingress-nginx -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — platform
        run: flux reconcile kustomization platform -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — infra
        run: flux reconcile kustomization infra -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — iam
        run: flux reconcile kustomization iam -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — core-banking
        run: flux reconcile kustomization core-banking -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — apis
        run: flux reconcile kustomization apis -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — app
        run: flux reconcile kustomization app -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — kyc
        run: flux reconcile kustomization kyc -n flux-system --timeout=3m || true

      - name: Reconcile Kustomization — kong
        run: flux reconcile kustomization kong -n flux-system --timeout=5m || true

      - name: Reconcile HelmReleases — apim (Kong)
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n apim --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n apim --timeout=5m || true
          done

      - name: Reconcile HelmReleases — iam
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n iam --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n iam --timeout=3m || true
          done

      - name: Reconcile HelmReleases — core-banking
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n core-banking --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n core-banking --timeout=3m || true
          done

      - name: Reconcile HelmReleases — apis (api)
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n api --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n api --timeout=3m || true
          done

      - name: Reconcile HelmReleases — app
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n app --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n app --timeout=3m || true
          done

      - name: Reconcile HelmReleases — kyc
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n kyc --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n kyc --timeout=3m || true
          done

      - name: Reconcile HelmReleases — infra
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n infra --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n infra --timeout=3m || true
          done

      - name: Reconcile HelmReleases — payment-hub
        run: |
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n payment-hub --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            flux reconcile helmrelease "$name" -n payment-hub --timeout=3m || true
          done
