# AI API chart is in this gitops repo (no OCI publish required).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-api
  namespace: ai
spec:
  interval: 5m
  chart:
    spec:
      chart: ./apps/ai-api/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: ai-api-values
      valuesKey: values.yaml
