apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: codecentric
  namespace: flux-system
spec:
  interval: 1h
  url: https://codecentric.github.io/helm-charts
---
# OCI: fin-engine chart (core-banking-helm-charts repo). Create secret: see README.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: core-banking-helm-chart-oci
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/finetech-nexus/core-banking-helm-chart
  secretRef:
    name: ghcr-auth
---
# OCI: core-banking chart (core-banking-api-charts repo)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: core-banking-api-chart-oci
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/finetech-nexus/core-banking-api-chart
  secretRef:
    name: ghcr-auth
