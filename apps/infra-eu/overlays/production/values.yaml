# Production: full replication, SASL + TLS, existingSecret.
global:
  kibanaEnabled: true

mongodb:
  enabled: false
mongo-express:
  enabled: false
redis:
  enabled: false
mysql:
  enabled: false
redpanda-console:
  enabled: false
console:
  enabled: false

kafka:
  enabled: true
  fullnameOverride: kafka
  persistence:
    enabled: true
    size: 20Gi
  broker:
    replicaCount: 3
    heapOpts: "-Xms512M -Xmx1024M"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1536Mi"
        cpu: "1000m"
  extraConfig: |
    auto.create.topics.enable=true
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    min.insync.replicas=2
  listeners:
    client:
      protocol: SASL_PLAINTEXT
      advertisedListeners: SASL_PLAINTEXT://kafka:9092
    interBroker:
      protocol: SASL_PLAINTEXT
      advertisedListeners: SASL_PLAINTEXT://kafka:9092
  auth:
    enabled: true
    clientProtocol: sasl_plaintext
    interBrokerProtocol: sasl_plaintext
    existingSecret: kafka-auth
  zookeeper:
    enabled: true
    fullnameOverride: zookeeper
    replicaCount: 3
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  controller:
    replicaCount: 0
  provisioning:
    enabled: true
    numPartitions: 3
    replicationFactor: 3
    topics: []

elasticsearch:
  enabled: true
  master:
    replicaCount: 3
    persistence:
      enabled: true
      size: 30Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  data:
    replicaCount: 2
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"
  coordinating:
    replicaCount: 1
  ingest:
    replicaCount: 0
  security:
    existingSecret: elasticsearch-auth
    tls:
      restEncryption: true
  ingress:
    enabled: false
  kibana:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    ingress:
      enabled: false
