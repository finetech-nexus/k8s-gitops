# Base HelmRelease: from OCI (infra-helm-charts). Env-specific values from overlay ConfigMap "infra-values".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infra
  namespace: infra
spec:
  interval: 5m
  chart:
    spec:
      chart: infra
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: infra-helm-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: infra-values
      valuesKey: values.yaml
  # Optional: add Secret refs for auth (kafka-auth, elasticsearch-auth) in overlays
