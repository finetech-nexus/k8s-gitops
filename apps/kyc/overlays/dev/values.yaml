# KYC dev overlay — hosts under kyc.dev.sandbox.internal.nbank.fr. TLS: secret "nbank" (ClusterIssuer/cert for *.dev.sandbox.internal.nbank.fr).
# Chart template tls.yaml creates tls-kyc-nexusbank for sandbox.nexus-bank.io; this overlay uses "nbank" for nbank.fr.
postgresql:
  image:
    repository: nexusbank/postgres-plv8
    tag: 15.3-3.1.7
  enabled: true
  auth:
    username: admin
    password: admin
    postgresPassword: admin
    database: postgres
  persistence:
    existingClaim: postgresql-pv-claim
  volumePermissions:
    enabled: true
    image:
      repository: bitnami/minideb
      tag: bullseye
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0


backoffice:
  enabled: true
  replicas: 1
  strategyType: RollingUpdate
  updateStrategy:
    maxSurge: 1
    maxUnavailable: '0'
  nameOverride: backoffice
  service:
    port: 80
    type: ClusterIP
    protocol: TCP
  applicationConfig:
    VITE_DOMAIN: https://workflowsvc.kyc.dev.sandbox.internal.nbank.fr
    VITE_API_KEY: secret
    VITE_AUTH_ENABLED: "true"
    VITE_MOCK_SERVER: "false"
    VITE_POLLING_INTERVAL: 10
    VITE_ASSIGNMENT_POLLING_INTERVAL: 5
    VITE_FETCH_SIGNED_URL: "false"
    VITE_ENVIRONMENT_NAME: local

  image:
    registry: docker.io
    #repository: 'ballerine-io/backoffice'
    repository: 'nexusbank/ballerine-x-ballerine-case-managment'
    pullPolicy: Always
    pullSecrets: ""
    tag: "latest"
  ingress:
    enabled: true
    className: "nginx"
    pathtype: Prefix
    annotations:
      kubernetes.io/ingress.class: nginx
    #ingress.annotations.service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "<your aws acm arn>"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://workflowdashboard.kyc.dev.sandbox.internal.nbank.fr"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type,X-Requested-With"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/limit-rps: "15"
    hosts:
      - host: backoffice.kyc.dev.sandbox.internal.nbank.fr
        paths:
          - path: /
    tls:
       - secretName: nbank
         hosts:
           - backoffice.kyc.dev.sandbox.internal.nbank.fr


