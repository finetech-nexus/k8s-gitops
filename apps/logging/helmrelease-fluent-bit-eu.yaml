apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit-eu
  namespace: logging
  labels:
    nexus.bank/residency: eu
spec:
  interval: 10m
  timeout: 10m
  releaseName: fluent-bit-eu
  chart:
    spec:
      chart: fluent-bit
      version: "0.47.10"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  targetNamespace: logging
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: fluent-bit-eu
    # EU residency shipper → infra-eu ES. Enrich with functional_perimeter (metier).
    env:
      - name: ES_USER
        valueFrom:
          secretKeyRef:
            name: elastic-credentials-eu
            key: username
      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: elastic-credentials-eu
            key: password
    luaScripts:
      functional.lua: |
        function enrich(tag, timestamp, record)
            local ns = record["k8s_namespace_name"] or ""
            local map = {
                ["payment-hub-eu"] = "payments",
                ["core-banking-eu"] = "core-banking",
                ["kyc-eu"] = "kyc",
                ["api-eu"] = "api",
                ["infra-eu"] = "platform",
            }
            record["functional_perimeter"] = map[ns] or "other"
            record["residency"] = "eu"
            record["cluster"] = "sandbox-dev"
            if record["message"] == nil or record["message"] == "" then
                record["message"] = record["log"] or record["MESSAGE"] or ""
            end
            local lvl = record["level"] or record["severity"] or record["log_level"] or record["LEVEL"]
            if lvl == nil or lvl == "" then
                local msg = string.upper(tostring(record["message"] or ""))
                if string.find(msg, "FATAL", 1, true) or string.find(msg, "CRITICAL", 1, true) then
                    lvl = "fatal"
                elseif string.find(msg, "ERROR", 1, true) or string.find(msg, " ERR", 1, true) then
                    lvl = "error"
                elseif string.find(msg, "WARN", 1, true) then
                    lvl = "warn"
                elseif string.find(msg, "DEBUG", 1, true) then
                    lvl = "debug"
                elseif string.find(msg, "INFO", 1, true) then
                    lvl = "info"
                else
                    lvl = "unknown"
                end
            else
                lvl = string.lower(tostring(lvl))
            end
            record["level"] = lvl
            return 1, timestamp, record
        end
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 5
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 10MB
            Skip_Long_Lines On
      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude On
        [FILTER]
            Name nest
            Match kube.*
            Operation lift
            Nested_under kubernetes
            Add_prefix k8s_
        [FILTER]
            Name grep
            Match kube.*
            Regex k8s_namespace_name ^(payment-hub-eu|api-eu|core-banking-eu|kyc-eu|infra-eu)$
        [FILTER]
            Name lua
            Match kube.*
            script /fluent-bit/scripts/functional.lua
            call enrich
      outputs: |
        [OUTPUT]
            Name es
            Match kube.*
            Host infra-elasticsearch.infra-eu.svc.cluster.local
            Port 9200
            HTTP_User ${ES_USER}
            HTTP_Passwd ${ES_PASSWORD}
            Logstash_Format On
            Logstash_Prefix logs-eu
            Suppress_Type_Name On
            Replace_Dots On
            Retry_Limit False
            tls Off
            tls.verify Off
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    tolerations:
      - operator: Exists
