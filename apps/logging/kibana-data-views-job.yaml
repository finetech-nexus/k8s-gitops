# Creates Kibana data views for functional-perimeter log browsing once Kibana is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-data-views-v3
  namespace: logging
  labels:
    nexus.bank/functional-perimeter: platform
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.10.1
          env:
            - name: KIBANA_URL
              value: http://infra-kibana.infra.svc.cluster.local:5601
            - name: ES_URL
              value: http://infra-elasticsearch.infra.svc.cluster.local:9200
            - name: ES_USER
              value: elastic
            - name: ES_PASSWORD
              value: elasticSearchPas42
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Elasticsearch..."
              until curl -sf -u "$ES_USER:$ES_PASSWORD" "$ES_URL/_cluster/health"; do sleep 10; done
              echo "Waiting for Kibana..."
              until curl -sf "$KIBANA_URL/api/status" | grep -q available; do sleep 15; done

              # Backfill message from log so Discover stops showing "failed to find message".
              curl -sf -u "$ES_USER:$ES_PASSWORD" -X POST "$ES_URL/logs-tn-*/_update_by_query?conflicts=proceed&wait_for_completion=false" \
                -H 'Content-Type: application/json' \
                -d '{"script":{"lang":"painless","source":"if (ctx._source.message == null || ctx._source.message == \"\") { if (ctx._source.log != null) { ctx._source.message = ctx._source.log; } }"},"query":{"bool":{"must_not":[{"exists":{"field":"message"}}]}}}' \
                || true

              create_view() {
                id="$1"; title="$2"; pattern="$3"
                # Prefer update; create if missing. Default columns: message + perimeter.
                body="{\"data_view\":{\"title\":\"$pattern\",\"name\":\"$title\",\"timeFieldName\":\"@timestamp\"}}"
                curl -sf -u "$ES_USER:$ES_PASSWORD" -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                  -X POST "$KIBANA_URL/api/data_views/data_view/$id" \
                  -d "$body" \
                || curl -sf -u "$ES_USER:$ES_PASSWORD" -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                  -X POST "$KIBANA_URL/api/data_views/data_view" \
                  -d "{\"data_view\":{\"id\":\"$id\",\"title\":\"$pattern\",\"name\":\"$title\",\"timeFieldName\":\"@timestamp\"}}" \
                || true
              }
              create_view "logs-tn" "Logs TN (all perimeters)" "logs-tn-*"
              create_view "logs-tn-kyc" "Logs KYC" "logs-tn-*"
              create_view "zeebe" "Zeebe / payments" "zeebe-*"
              echo "Data views requested."
