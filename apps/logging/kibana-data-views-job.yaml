# Creates Kibana data views + Discover saved searches filtered by k8s namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-data-views-v4
  namespace: logging
  labels:
    nexus.bank/functional-perimeter: platform
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.10.1
          env:
            - name: KIBANA_URL
              value: http://infra-kibana.infra.svc.cluster.local:5601
            - name: ES_URL
              value: http://infra-elasticsearch.infra.svc.cluster.local:9200
            - name: ES_USER
              value: elastic
            - name: ES_PASSWORD
              value: elasticSearchPas42
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Elasticsearch..."
              until curl -sf -u "$ES_USER:$ES_PASSWORD" "$ES_URL/_cluster/health"; do sleep 10; done
              echo "Waiting for Kibana..."
              until curl -sf "$KIBANA_URL/api/status" | grep -q available; do sleep 15; done

              kbn() {
                curl -sf -u "$ES_USER:$ES_PASSWORD" -H 'kbn-xsrf: true' -H 'Content-Type: application/json' "$@"
              }

              ensure_data_view() {
                id="$1"; name="$2"; pattern="$3"
                body="{\"data_view\":{\"id\":\"$id\",\"title\":\"$pattern\",\"name\":\"$name\",\"timeFieldName\":\"@timestamp\"}}"
                kbn -X POST "$KIBANA_URL/api/data_views/data_view" -d "$body" \
                  || kbn -X POST "$KIBANA_URL/api/data_views/data_view/$id" -d "{\"data_view\":{\"title\":\"$pattern\",\"name\":\"$name\",\"timeFieldName\":\"@timestamp\"}}" \
                  || true
                echo "data_view $id ($name)"
              }

              # Discover saved search scoped to one namespace (filter on k8s_namespace_name).
              ensure_ns_search() {
                ns="$1"
                id="ns-${ns}"
                title="NS / ${ns}"
                # searchSourceJSON: data view id logs-tn + kuery filter
                search_source=$(printf '%s' "{\"index\":\"logs-tn\",\"query\":{\"query\":\"k8s_namespace_name: \\\"${ns}\\\"\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}")
                # Escape for JSON string embedding
                search_source_esc=$(printf '%s' "$search_source" | sed 's/\\/\\\\/g; s/"/\\"/g')
                body=$(printf '%s' "{\"attributes\":{\"title\":\"${title}\",\"description\":\"Logs for namespace ${ns}\",\"columns\":[\"message\",\"k8s_pod_name\",\"functional_perimeter\",\"k8s_namespace_name\"],\"sort\":[[\"@timestamp\",\"desc\"]],\"kibanaSavedObjectMeta\":{\"searchSourceJSON\":\"${search_source_esc}\"}}}")
                kbn -X POST "$KIBANA_URL/api/saved_objects/search/${id}?overwrite=true" -d "$body" \
                  && echo "search $id OK" \
                  || echo "search $id FAILED"
              }

              ensure_data_view "logs-tn" "Logs TN (all namespaces)" "logs-tn-*"
              ensure_data_view "zeebe" "Zeebe / payments" "zeebe-*"

              # Namespaces shipped by fluent-bit-tn (grep allowlist).
              for ns in payment-hub api core-banking kyc infra kyc-aml aml app kong iam treasury reconciliation webapp docs; do
                ensure_data_view "logs-ns-${ns}" "Logs · ${ns}" "logs-tn-*"
                ensure_ns_search "$ns"
              done

              # Perimeter shortcuts (same index, named for Discover).
              for p in payments kyc aml api gateway iam core-banking treasury reconciliation platform; do
                id="perimeter-${p}"
                title="Perimeter / ${p}"
                search_source=$(printf '%s' "{\"index\":\"logs-tn\",\"query\":{\"query\":\"functional_perimeter: \\\"${p}\\\"\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}")
                search_source_esc=$(printf '%s' "$search_source" | sed 's/\\/\\\\/g; s/"/\\"/g')
                body=$(printf '%s' "{\"attributes\":{\"title\":\"${title}\",\"description\":\"Logs for functional_perimeter=${p}\",\"columns\":[\"message\",\"k8s_namespace_name\",\"k8s_pod_name\",\"functional_perimeter\"],\"sort\":[[\"@timestamp\",\"desc\"]],\"kibanaSavedObjectMeta\":{\"searchSourceJSON\":\"${search_source_esc}\"}}}")
                kbn -X POST "$KIBANA_URL/api/saved_objects/search/${id}?overwrite=true" -d "$body" \
                  && echo "search $id OK" \
                  || echo "search $id FAILED"
              done

              echo "Kibana namespace views ready."
