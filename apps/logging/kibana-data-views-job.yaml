# One data view per namespace (filtered ES alias). No duplicate perimeter views.
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-data-views-v6
  namespace: logging
  labels:
    nexus.bank/functional-perimeter: platform
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.10.1
          env:
            - name: KIBANA_URL
              value: http://infra-kibana.infra.svc.cluster.local:5601
            - name: ES_URL
              value: http://infra-elasticsearch.infra.svc.cluster.local:9200
            - name: ES_USER
              value: elastic
            - name: ES_PASSWORD
              value: elasticSearchPas42
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Elasticsearch..."
              until curl -sf -u "$ES_USER:$ES_PASSWORD" "$ES_URL/_cluster/health"; do sleep 10; done
              echo "Waiting for Kibana..."
              until curl -sf "$KIBANA_URL/api/status" | grep -q available; do sleep 15; done

              es() { curl -sf -u "$ES_USER:$ES_PASSWORD" -H 'Content-Type: application/json' "$@"; }
              kbn() { curl -sf -u "$ES_USER:$ES_PASSWORD" -H 'kbn-xsrf: true' -H 'Content-Type: application/json' "$@"; }

              # Remove duplicate perimeter data views + old saved searches.
              for id in logs-perimeter-payments logs-perimeter-kyc logs-perimeter-aml logs-perimeter-api \
                         logs-perimeter-gateway logs-perimeter-iam logs-perimeter-core-banking \
                         logs-perimeter-treasury logs-perimeter-reconciliation logs-perimeter-platform \
                         logs-tn-kyc; do
                kbn -X DELETE "$KIBANA_URL/api/data_views/data_view/$id" >/dev/null 2>&1 || true
              done
              for id in perimeter-payments perimeter-kyc perimeter-aml perimeter-api perimeter-gateway \
                         perimeter-iam perimeter-core-banking perimeter-treasury perimeter-reconciliation \
                         perimeter-platform ns-payment-hub ns-api ns-core-banking ns-kyc ns-infra ns-kyc-aml \
                         ns-aml ns-app ns-kong ns-iam ns-treasury ns-reconciliation ns-webapp ns-docs; do
                kbn -X DELETE "$KIBANA_URL/api/saved_objects/search/$id" >/dev/null 2>&1 || true
              done
              # Drop perimeter aliases (keep only namespace aliases).
              for p in payments kyc aml api gateway iam core-banking treasury reconciliation platform; do
                es -X POST "$ES_URL/_aliases" -d "{\"actions\":[{\"remove\":{\"index\":\"logs-tn-*\",\"alias\":\"logs-perimeter-${p}\"}}]}" >/dev/null 2>&1 || true
              done

              ensure_ns_alias() {
                ns="$1"
                alias="logs-ns-${ns}"
                es -X POST "$ES_URL/_aliases" -d "{\"actions\":[{\"remove\":{\"index\":\"logs-tn-*\",\"alias\":\"${alias}\"}}]}" >/dev/null 2>&1 || true
                es -X POST "$ES_URL/_aliases" -d "{\"actions\":[{\"add\":{\"index\":\"logs-tn-*\",\"alias\":\"${alias}\",\"filter\":{\"term\":{\"k8s_namespace_name\":\"${ns}\"}}}}]}" \
                  && echo "alias ${alias} OK" || echo "alias ${alias} FAILED"
              }

              ensure_data_view() {
                id="$1"; name="$2"; pattern="$3"
                kbn -X DELETE "$KIBANA_URL/api/data_views/data_view/$id" >/dev/null 2>&1 || true
                body="{\"data_view\":{\"id\":\"$id\",\"title\":\"$pattern\",\"name\":\"$name\",\"timeFieldName\":\"@timestamp\",\"allowNoIndex\":true}}"
                kbn -X POST "$KIBANA_URL/api/data_views/data_view" -d "$body" \
                  && echo "data_view $id OK" || echo "data_view $id FAILED"
              }

              ensure_data_view "logs-tn" "Logs TN (all namespaces)" "logs-tn-*"
              ensure_data_view "zeebe" "Zeebe / payments" "zeebe-*"

              # Namespace views only (functional perimeter = field filter in Discover, not a second view).
              for ns in payment-hub api core-banking kyc infra kyc-aml aml app kong iam treasury reconciliation webapp docs; do
                ensure_ns_alias "$ns"
                ensure_data_view "logs-ns-${ns}" "Logs · ${ns}" "logs-ns-${ns}"
              done

              echo "=== app namespace doc count ==="
              es "$ES_URL/logs-ns-app/_count" || true
              echo
              echo "=== api namespace doc count ==="
              es "$ES_URL/logs-ns-api/_count" || true
              echo
              echo "Kibana views deduped (namespace-only)."
