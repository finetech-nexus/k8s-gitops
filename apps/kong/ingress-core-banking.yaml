# Core banking app — Kong Ingress in core-banking namespace (backend must be in same namespace)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core-banking
  namespace: core-banking
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: "core-banking.dev.sandbox.nbank.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-banking
                port:
                  number: 80
