# Traefik (k3s): forward *.dev.sandbox.nbank.fr to Kong proxy in apim namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-to-kong
  namespace: apim
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  rules:
    - host: "*.dev.sandbox.nbank.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: "*.internal.dev.sandbox.nbank.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
