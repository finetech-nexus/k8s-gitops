# Traefik (k3s): forward these hosts to Kong proxy so the request reaches Kong instead of Traefik 404.
# Kong then routes per its own Ingress (e.g. apim-routes → public-app). Adjust Kong proxy service name if needed (e.g. kong-kong-proxy).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-to-kong
  namespace: apim
  annotations:
    # Use Traefik so k3s Traefik picks this up and forwards to Kong (not nginx)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  rules:
    # dev.sandbox.nbank.fr hosts — forward to Kong proxy (Kong then routes to public-app / nginx backends)
    - host: web-app.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: fynams.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: hooks-api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: cbanking-api.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: app.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: app-ws.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: iam.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
    - host: core-banking.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
