# Proxy so Kong (KIC) has a Service backend; forwards to http://web-app.dev.sandbox.nbank.fr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-proxy-nginx-config
  namespace: apim
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      resolver k8s-default.svc.cluster.local valid=10s;
      server {
        listen 80;
        location / {
          set $upstream http://web-app.dev.sandbox.nbank.fr;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-proxy
  namespace: apim
  labels:
    app: webapp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-proxy
  template:
    metadata:
      labels:
        app: webapp-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: webapp-proxy-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-proxy
  namespace: apim
spec:
  type: ClusterIP
  selector:
    app: webapp-proxy
  ports:
    - port: 80
      targetPort: 80
      name: http
