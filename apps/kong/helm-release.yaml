# Kong Gateway (APIM) — official Kong Helm chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong
  namespace: apim
spec:
  interval: 5m
  chart:
    spec:
      chart: kong
      version: "~3.0"
      sourceRef:
        kind: HelmRepository
        name: kong
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false  # namespace apim created by kustomization
    timeout: 10m  # first install can be slow (images, rollout)
  upgrade:
    remediation:
      retries: 3
  values:
    # Proxy (API gateway) — LoadBalancer = external IP, no port-forward needed
    proxy:
      type: LoadBalancer
    ingressController:
      install: true
    # Writable prefix path (container root is read-only; avoid /KONG_)
    env:
      prefix: /tmp/kong
