# Host-based routing: Kong Ingress Controller routes to backends (public-app, internal-app in apim).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apim-routes
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: "*.dev.sandbox.nbank.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-app
                port:
                  number: 80
    - host: "*.internal.dev.sandbox.nbank.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: internal-app
                port:
                  number: 80
