# All KongPlugins for this overlay. Must exist before HTTPRoutes that reference them.
# Apply first (list this file first in kustomization.yaml).
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: internal-only
  namespace: apim
plugin: ip-restriction
config:
  allow:
    - 0.0.0.0/0
    - "::/0"
