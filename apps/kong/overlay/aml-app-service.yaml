# Kong -> ingress-nginx: Marble console.
---
apiVersion: v1
kind: Service
metadata:
  name: aml-app-internal
  namespace: apim
  annotations:
    konghq.com/host-header: aml-app.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
