# KYC EU: HTTPRoutes -> Kong -> ingress-nginx (*.kyc.dev1.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backoffice-kyc-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - backoffice.kyc.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: backoffice-kyc-eu-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workflowdashboard-kyc-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - workflowdashboard.kyc.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: workflowdashboard-kyc-eu-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workflowsvc-kyc-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - workflowsvc.kyc.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: workflowsvc-kyc-eu-internal
          port: 443
