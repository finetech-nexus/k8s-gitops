# Kong -> ingress-nginx: KYC backend Services.
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice-kyc-internal
  namespace: apim
  annotations:
    konghq.com/host-header: backoffice.kyc.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
