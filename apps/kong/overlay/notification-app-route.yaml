# Notification studio: HTTPRoute -> Kong -> ingress-nginx.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notification-app-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - notification-app.dev.sandbox.internal.nbank.fr
    - notification-app.payment-hub.dev.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: notification-app-internal
          port: 443
