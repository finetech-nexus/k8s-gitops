# Kong -> ingress-nginx: Kibana TN (infra namespace).
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-internal
  namespace: apim
  annotations:
    konghq.com/host-header: kibana.api.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
