# Kong -> ingress-nginx: Kibana TN (infra namespace).
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-internal
  namespace: apim
  annotations:
    # Ingress still publishes kibana.mifos.gazelle.test until infra HR rolls the new host.
    konghq.com/host-header: kibana.mifos.gazelle.test

    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
