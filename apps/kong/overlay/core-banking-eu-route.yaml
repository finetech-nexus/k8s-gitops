# Core Banking EU: fynams, webapp, hooks-api -> Kong -> ingress-nginx (*.dev1.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fynams-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - fynams.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: fynams-eu-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - web-app.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: webapp-eu-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hooks-api-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - hooks-api.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: hooks-api-eu-internal
          port: 443
