# Webapp: Gateway API HTTPRoute (web-app.dev.sandbox.nbank.fr) -> Kong Gateway -> ExternalName Service.
# Uses KongPlugin internal-only (allow *). No KongService.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - web-app.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: webapp-internal
          port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: web-app.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: internal-only
  namespace: apim
plugin: ip-restriction
config:
  allow:
    - 0.0.0.0/0
    - "::/0"
