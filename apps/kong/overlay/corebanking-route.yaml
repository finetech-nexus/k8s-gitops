# Webapp: LB (web-app.dev.sandbox.nbank.fr) -> Kong Ingress -> ExternalName Service -> internal host.
# No KongService: backend is ExternalName Service. Uses KongPlugin internal-only (allow *).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: web-app.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-internal
                port:
                  number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: web-app.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: internal-only
  namespace: apim
plugin: ip-restriction
config:
  allow:
    - 0.0.0.0/0
    - "::/0"
