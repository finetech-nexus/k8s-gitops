# Webapp: HTTPRoute -> Kong -> ingress-nginx (by IP, Host in nginx-ingress-upstream.yaml). Uses KongPlugin internal-only.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - web-app.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: webapp-internal
          port: 443
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: internal-only
  namespace: apim
plugin: ip-restriction
config:
  allow:
    - 0.0.0.0/0
    - "::/0"
