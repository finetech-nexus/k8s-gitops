# Webapp: HTTPRoute -> Kong -> ingress-nginx (by IP, Host in nginx-ingress-upstream.yaml).
# KongPlugin internal-only is in overlay/kong-plugins.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - web-app.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: webapp-internal
          port: 443
