# Europe SWIFT console: HTTPRoute -> Kong -> ingress-nginx.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: swift-app-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - swift-app.dev1.sandbox.internal.nbank.fr
    - swift-app.payment-hub.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: swift-app-eu-internal
          port: 443
