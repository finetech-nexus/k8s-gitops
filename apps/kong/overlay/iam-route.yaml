# IAM: LB (iam.dev.sandbox.nbank.fr) -> Kong Ingress -> ExternalName Service -> internal host.
# No KongService: backend is ExternalName Service. Uses KongPlugin internal-only.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: iam.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam-internal
                port:
                  number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: iam-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: iam.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
