# IAM: LB (iam.dev.sandbox.nbank.fr) -> Kong Ingress -> KongService (nginx ingress) -> service.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/service-name: iam-internal-service
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: iam.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam-placeholder
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: iam-placeholder
  namespace: apim
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: iam-placeholder
---
apiVersion: configuration.konghq.com/v1
kind: KongService
metadata:
  name: iam-internal-service
  namespace: apim
spec:
  url: "http://iam.dev.sandbox.internal.nbank.fr"
