# IAM: Gateway API HTTPRoute (iam.dev.sandbox.nbank.fr) -> Kong Gateway -> ExternalName Service.
# Uses KongPlugin internal-only. No KongService.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - iam.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: iam-internal
          port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: iam-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: iam.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
