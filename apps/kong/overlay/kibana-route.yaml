# Kibana TN: HTTPRoute -> Kong -> ingress-nginx.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - kibana.api.dev.sandbox.nbank.fr
    - kibana.api.dev.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: kibana-internal
          port: 443
