# Payment Hub: HTTPRoutes -> Kong -> ingress-nginx (Host in payment-hub-service.yaml).
# Hostnames: zeebe-operate, minio-console, zeebeops, ops-bk-web (*.payment-hub.dev.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeebe-operate-ph-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - zeebe-operate.payment-hub.dev.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: zeebe-operate-ph-internal
          port: 443
---
