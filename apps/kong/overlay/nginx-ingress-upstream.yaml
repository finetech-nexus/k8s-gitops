# Kong -> ingress-nginx by fixed IP:port (avoids DNS resolution of internal hostnames).
# ingress-nginx LoadBalancer IP; Kong sends Host header so nginx can route.
# Update the address below if the ingress-nginx LoadBalancer IP changes.
---
apiVersion: v1
kind: Service
metadata:
  name: app-api-internal
  namespace: apim
  annotations:
    konghq.com/host-header: app.api.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
---
apiVersion: v1
kind: Endpoints
metadata:
  name: app-api-internal
  namespace: apim
subsets:
  - addresses:
      - ip: 95.217.169.62
    ports:
      - port: 443
        name: https
---
