# App API: LB (app.api.dev.sandbox.nbank.fr, app-ws.api.dev.sandbox.nbank.fr) -> Kong -> ExternalName Service -> internal host.
# Uses KongPlugin internal-only from corebanking-route.yaml (allow *).
# No KongService: backends are ExternalName Services.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-api-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: app.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-api-internal
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ws-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: app-ws.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-ws-internal
                port:
                  number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: app-api-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: app.api.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
---
apiVersion: v1
kind: Service
metadata:
  name: app-ws-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: app-ws.api.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
