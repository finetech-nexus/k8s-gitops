# App API: Gateway API HTTPRoute (app.api.dev.sandbox.nbank.fr, app-ws.api.dev.sandbox.nbank.fr) -> Kong Gateway -> ExternalName Service.
# Uses KongPlugin internal-only from corebanking-route.yaml. No KongService.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-api-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - app.api.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: app-api-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-ws-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - app-ws.api.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: app-ws-internal
          port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: app-api-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: app.api.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
---
apiVersion: v1
kind: Service
metadata:
  name: app-ws-internal
  namespace: apim
spec:
  type: ExternalName
  externalName: app-ws.api.dev.sandbox.internal.nbank.fr
  ports:
    - port: 443
      name: https
