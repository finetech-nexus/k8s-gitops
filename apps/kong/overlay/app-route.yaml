# App API: HTTPRoute -> Kong -> ingress-nginx (by IP, Host header set in nginx-ingress-upstream.yaml).
# Hostnames apim.nbank.fr and app.api.dev.sandbox.nbank.fr both proxy to app-api-internal (Kong sets Host: app.api.dev.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-api-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - apim.nbank.fr
    - app.api.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: app-api-internal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-ws-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - app-ws.api.dev.sandbox.nbank.fr
  rules:
    - backendRefs:
        - name: app-ws-internal
          port: 443
