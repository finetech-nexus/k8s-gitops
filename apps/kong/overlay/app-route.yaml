# App API: LB (app.api.dev.sandbox.nbank.fr, app-ws.api.dev.sandbox.nbank.fr) -> Kong -> nginx ingress -> service.
# Uses KongPlugin internal-only from corebanking-route.yaml (allow *).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-api-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/service-name: app-api-internal-service
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: app.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-api-placeholder
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ws-kong-ingress
  namespace: apim
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/service-name: app-ws-internal-service
    konghq.com/plugins: internal-only
spec:
  ingressClassName: kong
  rules:
    - host: app-ws.api.dev.sandbox.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-ws-placeholder
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-api-placeholder
  namespace: apim
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: app-api-placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: app-ws-placeholder
  namespace: apim
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: app-ws-placeholder
---
apiVersion: configuration.konghq.com/v1
kind: KongService
metadata:
  name: app-api-internal-service
  namespace: apim
spec:
  url: "http://app.api.dev.sandbox.internal.nbank.fr"
---
apiVersion: configuration.konghq.com/v1
kind: KongService
metadata:
  name: app-ws-internal-service
  namespace: apim
spec:
  url: "http://app-ws.api.dev.sandbox.internal.nbank.fr"
