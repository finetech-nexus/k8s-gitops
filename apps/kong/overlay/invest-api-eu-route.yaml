# Invest API EU: HTTPRoute -> Kong -> ingress-nginx.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invest-api-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - invest-api.api.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: invest-api-eu-internal
          port: 443
