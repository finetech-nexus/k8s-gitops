# Payment Hub EU: HTTPRoutes -> Kong -> ingress-nginx (*.payment-hub.dev1.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeebe-operate-ph-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - zeebe-operate.payment-hub.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: zeebe-operate-ph-eu-internal
          port: 443
