# Kong -> ingress-nginx: Grafana (monitoring namespace).
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-internal
  namespace: apim
  annotations:
    konghq.com/host-header: grafana.api.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
