# Kong -> ingress-nginx: Europe SWIFT console.
---
apiVersion: v1
kind: Service
metadata:
  name: swift-app-eu-internal
  namespace: apim
  annotations:
    konghq.com/host-header: swift-app.dev1.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
