# Firebase auth paths on the console host. Same ingress as the console, so the
# request keeps a host the browser can use. The console proxy sends these paths
# to the emulator. Kept off the console route so the response rewriter does not
# alter emulator pages.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aml-app-auth-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: internal-only
    konghq.com/priority: "100"
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - aml-app.dev.sandbox.nbank.fr
    - aml-app.dev.sandbox.internal.nbank.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /emulator
        - path:
            type: PathPrefix
            value: /identitytoolkit.googleapis.com
        - path:
            type: PathPrefix
            value: /securetoken.googleapis.com
        - path:
            type: PathPrefix
            value: /__/auth
      backendRefs:
        - name: aml-app-internal
          port: 443
