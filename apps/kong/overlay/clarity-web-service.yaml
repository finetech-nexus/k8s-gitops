# Kong -> ingress-nginx: Clarity console.
---
apiVersion: v1
kind: Service
metadata:
  name: clarity-web-internal
  namespace: apim
  annotations:
    konghq.com/host-header: clarity.api.dev.sandbox.internal.nbank.fr
    konghq.com/protocol: "https"
    konghq.com/tls-verify: "false"
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https
