# API EU (Core Banking API): HTTPRoute -> Kong -> ingress-nginx (cbanking-api.api.dev1.sandbox.internal.nbank.fr).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cbanking-api-eu-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - cbanking-api.api.dev1.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: cbanking-api-eu-internal
          port: 443
