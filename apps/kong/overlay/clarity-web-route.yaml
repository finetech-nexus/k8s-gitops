# Clarity console: HTTPRoute -> Kong -> ingress-nginx.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clarity-web-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - clarity.api.dev.sandbox.nbank.fr
    - clarity.api.dev.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: clarity-web-internal
          port: 443
