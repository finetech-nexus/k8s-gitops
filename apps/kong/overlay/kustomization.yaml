# Kong routes and plugins. Applied by kong-routes Kustomization after kong install (CRDs ready).
# KongPlugins first, then Services + Endpoints (Kong -> ingress-nginx), then HTTPRoutes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kong-plugins.yaml
  - gateway-api.yaml
  - app-service.yaml
  - app-endpoints.yaml
  - webapp-service.yaml
  - webapp-endpoints.yaml
  - docs-service.yaml
  - docs-endpoints.yaml
  - iam-service.yaml
  - iam-endpoints.yaml
  - fynams-service.yaml
  - fynams-endpoints.yaml
  - kyc-service.yaml
  - kyc-endpoints.yaml
  - payment-hub-service.yaml
  - payment-hub-endpoints.yaml
  - ai-api-service.yaml
  - ai-api-endpoints.yaml
  # EU apps
  - kyc-eu-service.yaml
  - kyc-eu-endpoints.yaml
  - core-banking-eu-service.yaml
  - core-banking-eu-endpoints.yaml
  - api-eu-service.yaml
  - api-eu-endpoints.yaml
  - payment-hub-eu-service.yaml
  - payment-hub-eu-endpoints.yaml
  - ai-api-eu-service.yaml
  - ai-api-eu-endpoints.yaml
  - webapp-route.yaml
  - docs-route.yaml
  - fynams-route.yaml
  - kyc-route.yaml
  - iam-route.yaml
  - app-route.yaml
  - payment-hub-route.yaml
  - ai-api-route.yaml
  # EU routes
  - kyc-eu-route.yaml
  - core-banking-eu-route.yaml
  - api-eu-route.yaml
  - payment-hub-eu-route.yaml
  - ai-api-eu-route.yaml
