# Proxy apim.nbank.fr to app API (same backend as app.api.dev.sandbox.nbank.fr). Kong sends Host: app.api.dev.sandbox.internal.nbank.fr via app-api-internal Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apim-proxy-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - apim.nbank.fr
  rules:
    - backendRefs:
        - name: app-api-internal
          port: 443
