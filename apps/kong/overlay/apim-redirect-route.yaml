# When request hits Kong with Host apim.nbank.fr, respond with 301 redirect to app.api.dev.sandbox.nbank.fr (same path).
# BackendRef is required by Gateway API but never reached because the redirect plugin responds first.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apim-redirect-route
  namespace: apim
  annotations:
    konghq.com/plugins: apim-redirect-to-app-api
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - apim.nbank.fr
  rules:
    - backendRefs:
        - name: app-api-internal
          port: 443
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: apim-redirect-to-app-api
  namespace: apim
plugin: redirect
config:
  status_code: 301
  uri: https://app.api.dev.sandbox.nbank.fr
  keep_incoming_path: true
