# Kong -> ingress-nginx: Core Banking EU backend endpoints. Update IP if ingress-nginx LoadBalancer changes.
---
apiVersion: v1
kind: Endpoints
metadata:
  name: fynams-eu-internal
  namespace: apim
subsets:
  - addresses:
      - ip: 95.217.169.62
    ports:
      - port: 443
