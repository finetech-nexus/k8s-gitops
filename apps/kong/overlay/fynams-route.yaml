# Fynams (Fineract): HTTPRoute -> Kong -> ingress-nginx (Host in fynams-service.yaml).
# Hostnames: fynams.dev.sandbox.nbank.fr and fynams.dev.sandbox.internal.nbank.fr.
# KongPlugin internal-only is in overlay/kong-plugins.yaml.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fynams-route
  namespace: apim
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: internal-only
spec:
  parentRefs:
    - name: kong
      namespace: apim
  hostnames:
    - fynams.dev.sandbox.internal.nbank.fr
  rules:
    - backendRefs:
        - name: fynams-internal
          port: 443
