# Kong APIM — no global namespace so HelmRepository stays in flux-system
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-repository.yaml
  - namespace.yaml
  - helm-release.yaml
  - traefik-to-kong-ingress.yaml
  - ingress-routes.yaml
  - ingress-core-banking.yaml
  - public-app-service.yaml
