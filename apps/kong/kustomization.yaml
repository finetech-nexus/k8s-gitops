# Kong APIM — Flux: HelmRelease + values from base/values.yaml; Traefik → Kong ingress
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-repository.yaml
  - helm-release.yaml
  - overlay/gateway-api.yaml
  - overlay/corebanking-route.yaml
  - overlay/iam-route.yaml
  - overlay/app-route.yaml
configMapGenerator:
  - name: kong-values
    files:
      - base/values.yaml
    options:
      disableNameSuffixHash: true
patches:
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: apim
    target:
      kind: ConfigMap
      name: kong-values
