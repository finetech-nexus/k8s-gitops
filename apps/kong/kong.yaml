
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong-ingress
  namespace: kong
spec:
  interval: 5m
  releaseName: kong-ingress
  chart:
    spec:
      chart: ingress
      version: ""            # optional: pin a chart version here
      sourceRef:
        kind: HelmRepository
        name: kong
        namespace: flux-system
  targetNamespace: kong
  values:
    gateway:
      serviceMonitor:
        enabled: true      # ask Kong chart to create a ServiceMonitor
        labels:
          release: prometheus
    # expose status/metrics ports if you want to customize them
