# public-app: alias in apim for the nginx ingress controller (Kong → nginx traffic path).
# Kong's apim-routes Ingress sends *.dev.sandbox.nbank.fr to this service; nginx then routes by host.
# If your nginx controller uses another namespace/service, change externalName (e.g. infra namespace).
apiVersion: v1
kind: Service
metadata:
  name: public-app
  namespace: apim
spec:
  type: ExternalName
  externalName: ingress-nginx-controller.ingress-nginx.svc.cluster.local
