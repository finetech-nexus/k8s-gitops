# Payment Hub from HelmRepository OCI (payment-hub-helm-charts). Chart published to ghcr.io/finetech-nexus/payment-hub-helm-chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payment-hub
  namespace: payment-hub
spec:
  interval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: ph-ee-simulator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ph-ee-simulator
              spec:
                template:
                  spec:
                    containers:
                      - name: ph-ee-simulator
                        image: docker.io/nexusbank/ph-ee-simulator:fbc2ac4
                        imagePullPolicy: Always
  chart:
    spec:
      chart: payment-hub
      version: "1.0.7"
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: payment-hub-helm-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
    remediation:
      retries: 0
  rollback:
    disableWait: true
  valuesFrom:
    - kind: ConfigMap
      name: payment-hub-values
      valuesKey: values.yaml
