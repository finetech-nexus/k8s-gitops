# Payment Hub from HelmRepository OCI (payment-hub-helm-charts). Chart published to ghcr.io/finetech-nexus/payment-hub-helm-chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payment-hub
  namespace: payment-hub
spec:
  interval: 5m
  chart:
    spec:
      chart: payment-hub
      version: "1.0.7"
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: payment-hub-helm-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  rollback:
    disableWait: true
  valuesFrom:
    - kind: ConfigMap
      name: payment-hub-values
      valuesKey: values.yaml
