# Values from payment-hub-helm-charts for dev overlay.
# Chart: payment-hub (root Chart.yaml), dependencies: common, ph-ee-engine.

ph-ee-engine:
  enabled: true
  global:
    SPRING_PROFILES_ACTIVE: "bb,fin12,tenantsConnection"
    imagePullPolicy: "Always"
    LOGGING_LEVEL_ROOT: "INFO"
    tenants: "nexusbank"
    DFSPIDS: "nexusbank,bluebank"
  elasticsearch:
    enabled: false
  kibana:
    enabled: false

  importer_rdbms:
    enabled: true
    replicas: 1
    image: docker.io/openmf/ph-ee-importer-rdbms:v1.13.1-gazelle-1.1.0
    imagePullPolicy: IfNotPresent
    SPRING_PROFILES_ACTIVE: "rdbms,tenantsConnection"
    LOGGING_LEVEL_ROOT: "INFO"
    datasource:
      host: "mysql.infra.svc.cluster.local"
      core:
        host: mysql.infra.svc.cluster.local
        port: 3306
        schema: "tenants"
        username: "mifos"
        password: "password"
    deployment:
      extraEnvs:
        - name: KAFKA_BROKERS
          value: kafka.infra.svc.cluster.local:9092

  camunda-platform:
    global:
      elasticsearch:
        disableExporter: false
        host: "infra-elasticsearch.infra.svc.cluster.local"
        port: 9200
        clusterName: "fred"
      identity:
        auth:
          enabled: false

    zeebe:
      enabled: true
      broker:
        contactpoint: "ph-ee-gazelle-zeebe-gateway:26500"
      env:
        - name: ZEEBE_EXPORTERS_KAFKA_ARGS_PRODUCER_SERVERS
          value: kafka.infra.svc.cluster.local:9092
        - name: ZEEBE_BROKER_BACKPRESSURE_ENABLED
          value: "false"
        - name: ZEEBE_BROKER_EXECUTION_METRICS_EXPORTER_ENABLED
          value: "true"
        - name: ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_JARPATH
          value: "/exporters/ph-ee-kafka-exporter.jar"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_JARPATH
          value: "/exporters/ph-ee-kafka-exporter.jar"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_CLASSNAME
          value: "hu.dpc.rt.kafkastreamer.exporter.KafkaExporter"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_INITIALLIMIT
          value: "1000"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_ALPHA
          value: "2"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_BETA
          value: "8"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_EVENT
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_VARIABLE
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_PROCESSINSTANCE
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_PROCESS
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_INCIDENT
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_DEPLOYMENT
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_ERROR
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_JOB
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_VARIABLEDOCUMENT
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_WORKFLOWINSTANCE
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_CREATETEMPLATE
          value: 'false'
      resources:
        requests:
          cpu: 200m
          memory: 1200Mi
        limits:
          cpu: 960m
          memory: 1920Mi
      affinity: {}
      extraInitContainers:
        - name: init-ph-ee-kafka-exporter
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args: ['wget -O /exporters/ph-ee-kafka-exporter.jar "https://mifos.jfrog.io/artifactory/phee-gradle-local/org/mifos/phee/phee-exporter/exporter-1.1.1-SNAPSHOT.jar"; ls -al /exporters/']
          volumeMounts:
            - name: exporters
              mountPath: /exporters/

    zeebe-gateway:
      replicas: 1
      logLevel: debug
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 750Mi
      affinity: {}
      ingress:
        enabled: true
        host: "zeebe-gateway.sandbox.nexus-bank.io"

    operate:
      enabled: true
      replicas: 1
      logging:
        level:
          ROOT: INFO
          io.camunda.operate: DEBUG
      resources:
        requests:
          cpu: 300m
          memory: 400Mi
      affinity: {}
      ingress:
        enabled: true
        host: "zeebe-operate.sandbox.nexus-bank.io"

    tasklist:
      enabled: true
    optimize:
      enabled: false
    identity:
      enabled: false
    connectors:
      enabled: false
    elasticsearch:
      enabled: false

  ph_ee_connector_mojaloop:
    enabled: false

  post_installation_job:
    enabled: false
  integration_test:
    enabled: false

  operations_app:
    enabled: true
    SPRING_PROFILES_ACTIVE: "tenantsConnection,bb"
    secret:
      datasource:
        host: mysql.infra.svc.cluster.local
    datasource:
      username: "mifos"
      password: "password"
      host: mysql.infra.svc.cluster.local
      port: 3306
      schema: "tenants"
    image: docker.io/nexusbank/ph-ee-operations-app:1.17.1
    replicas: 1
    extraEnvs:
      - name: "BAASFLOW_EVENTS_DISABLED"
        value: "true"
      - name: "BAASFLOW_EVENTS_KAFKA_BROKERS"
        value: "kafka.infra.svc.cluster.local:9092"
      - name: "BAASFLOW_EVENTS_CHANNELS_AUDIT_TOPIC"
        value: "auditlog"
      - name: "FRONTEND_CALLBACK_URL_BASE"
        value: "ops-bk-web.mifos.gazelle.test"
      - name: "CHANNEL-CONNECTOR_URL"
        value: "channel.mifos.gazelle.test"
      - name: "CHANNEL-CONNECTOR_TRANSFER-PATH"
        value: "/channel/transfer"
      - name: "ZEEBE_GATEWAY_ADDRESS"
        value: "ph-ee-gazelle-zeebe-gateway:26500"
      - name: "SPRING_LIQUIBASE_CONTEXTS"
        value: "postgresql,initial_switch,tenant_store_db"
      - name: "SPRING_CONFIG_ADDITIONAL_LOCATION"
        value: "/config/"
    limits:
      memory: "3000M"
      cpu: "800m"
    requests:
      memory: "1000M"
      cpu: "500m"
    readinessProbe:
      httpGet:
        path: /oauth/token_key
        port: 5000
        httpHeaders:
          - name: Platform-TenantId
            value: nexusbank
        scheme: HTTP
      initialDelaySeconds: 120
      timeoutSeconds: 1
      periodSeconds: 30
      successThreshold: 1
      failureThreshold: 3
    ingress:
      enabled: true
      className: nginx
      annotations:
        kubernetes.io/ingress.class: "nginx"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://ops-bk-web.sandbox.nexus-bank.io"
        nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Platform-TenantId"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      tls:
        - secretName: sandbox-secret
      hosts:
        - host: ops-bk.sandbox.nexus-bank.io
          paths:
            - path: "/"
              backend:
                service:
                  name: "ph-ee-operations-app"
                  port:
                    number: 80

  operations_web:
    enabled: true
    image: docker.io/openmf/ph-ee-operations-web:gazelle-v1.1.0
    ingress:
      enabled: true
      className: nginx
      annotations:
        kubernetes.io/ingress.class: "nginx"
      hosts:
        - host: ops-bk-web.sandbox.nexus-bank.io
          paths:
            - path: "/"
              backend:
                service:
                  name: "ph-ee-operations-web"
                  port:
                    number: 4200
            - path: "/paymenthub"
              pathType: Prefix
              backend:
                service:
                  name: "ph-ee-operations-app"
                  port:
                    number: 4200
    backend:
      PH_OPS_BACKEND_SERVER_URL: https://ops-bk.sandbox.nexus-bank.io/api/v1
      PH_VOU_BACKEND_SERVER_URL: https://vouchers-demo.sandbox.nexus-bank.io
      PH_ACT_BACKEND_SERVER_URL: https://identity-mapper-demo.sandbox.nexus-bank.io
      PH_PLATFORM_TENANT_ID: nexusbank
      PH_PLATFORM_TENANT_IDS: nexusbank,bluebank
      PH_REGISTERING_INSTITUTION_ID: "123"
    auth:
      PH_OAUTH_ENABLED: false
      PH_OAUTH_TYPE: keycloak
      PH_OAUTH_SERVER_URL: https://iam.nexus-bank.io/auth
      PH_OAUTH_REALM: paymenthub
      PH_OAUTH_CLIENT_ID: opsapp
      PH_OAUTH_CLIENT_SECRET: YMoGqfaBo9aBmxMbT6x3L8PMUxvz5PSh
      PH_OAUTH_BASIC_AUTH: true
      PH_OAUTH_BASIC_AUTH_TOKEN: YMoGqfaBo9aBmxMbT6x3L8PMUxvz5PSh
    PH_DEFAULT_LANGUAGE: en
    PH_SUPPORTED_LANGUAGES: en,fr,es

  operationsmysql:
    enabled: false

  connector_bulk:
    enabled: true
    image: docker.io/nexusbank/ph-ee-bulk-processor:1.12.1
    imagePullPolicy: IfNotPresent
    tenants: "nexusbank,bluebank"
    operations_app:
      contactpoint: "http://ph-ee-operations-app:80"
      endpoints:
        batch_transaction: "/api/v1/batch/transactions"
    limits:
      memory: "1536M"
      cpu: "700m"
    requests:
      memory: "512M"
      cpu: "100m"
    deployment:
      extraEnvs:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError"
        - name: KAFKA_BOOTSTRAPADDRESS
          value: kafka.infra.svc.cluster.local:9092

  mockpayment:
    enabled: false

  ph_ee_connector_ams_mifos:
    enabled: true
    image: docker.io/nexusbank/ph-ee-connector-ams-mifos:1.7.0
    SPRING_PROFILES_ACTIVE: "fin12, bb"
    ams_local_enabled: true
    ams_local_interop_host: https://fynams.sandbox.nexus-bank.io
    ams_local_account_host: https://fynams.sandbox.nexus-bank.io
    ams_local_customer_host: https://fynams.sandbox.nexus-bank.io
    ams_local_auth_host: https://iam.nexus-bank.io
    ams_local_tenants: "nexusbank"
    ams_local_loan_host: ""
    operations_app:
      datasource:
        host: mysql.infra.svc.cluster.local
    hostAliases:
      - ip: "172.18.0.3"
        hostnames:
          - "fynams.sandbox.nexus-bank.io"
          - "iam.nexus-bank.io"

  channel:
    enabled: true
    image: docker.io/nexusbank/ph-ee-connector-channel:1.12.2
    tenantPrimary:
      clientId: "mifos"
      clientSecret: "password"
      tenant: "nexusbank"
    tenantSecondary:
      clientId: "mifos"
      clientSecret: "password"
      tenant: "bluebank"
    server:
      ssl:
        keyPassword: "password"
        keyStorePassword: "password"
    SPRING_PROFILES_ACTIVE: "fin12,bb,tenants"
    deployment:
      extraEnvs:
        - name: DESTINATION_DFSPID
          value: "nexusbank"
        - name: "SPRING_CONFIG_ADDITIONAL_LOCATION"
          value: "/config/"
        - name: "SERVER_SSL_ENABLED"
          value: "false"
        - name: "SERVER_PORT"
          value: "8080"
    LOGGING_LEVEL_ROOT: "INFO"
    limits:
      cpu: 500m
      memory: 1600Mi
    requests:
      cpu: 500m
      memory: 750Mi
    ingress:
      enabled: true
      className: nginx
      pathType: Prefix
      tls:
        - hosts:
            - channel.mifos.gazelle.test
          secretName: sandbox-secret
      hosts:
        - host: channel.mifos.gazelle.test
          paths:
            - path: /
              backend:
                service:
                  name: ph-ee-connector-channel
                  port:
                    number: 82

  minio:
    enabled: true
    resources:
      requests:
        memory: "2Gi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "500m"
    ingress:
      hosts:
        - minio.sandbox.nexus-bank.io
    consoleIngress:
      enabled: true
      ingressClassName: nginx
      labels: {}
      annotations: {}
      path: /
      hosts:
        - minio-console.sandbox.nexus-bank.io

  ph-ee-connector:
    enabled: true
    limits:
      memory: "2048M"
      cpu: "700m"
    requests:
      memory: "512M"
      cpu: "100m"

  zeebe_ops:
    enabled: true
    image: docker.io/nexusbank/ph-ee-zeebe-ops:1.4.0
    readinessProbe:
      initialDelaySeconds: 60
    livenessProbe:
      initialDelaySeconds: 60
    deployment:
      extraEnvs:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError"
    limits:
      memory: "768M"
      cpu: "500m"
    requests:
      memory: "512M"
      cpu: "50m"
    ingress:
      enabled: true
      hosts:
        - host: zeebeops.sandbox.nexus-bank.io
          paths:
            - path: "/"
              backend:
                service:
                  name: "ph-ee-zeebe-ops"
                  port:
                    number: 80

  ph_ee_connector_gsma:
    enabled: false
  billPay:
    enabled: false
  notifications:
    enabled: false
  messagegateway:
    enabled: false
  kafka:
    enabled: false
  redis:
    image:
      repository: bitnamilegacy/redis

account_mapper:
  enabled: false
