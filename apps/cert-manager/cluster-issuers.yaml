# ClusterIssuers for the project (domain: nbank.fr). cert-manager must be installed on the cluster.
# nbank: production (Let's Encrypt prod). nbank-staging: staging. nbank-dev: dev (Let's Encrypt staging, avoids prod rate limits).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank
spec:
  acme:
    email: amiladi@nbank.fr
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-acme-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank-staging
spec:
  acme:
    email: amiladi@nbank.fr
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-staging-acme-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Dev cluster: use Let's Encrypt staging to avoid production rate limits. Use with cert-manager.io/cluster-issuer: nbank-dev.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank-dev
spec:
  acme:
    email: amiladi@nbank.fr
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-dev-acme-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
