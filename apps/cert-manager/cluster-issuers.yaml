# ClusterIssuers for the project (domain: nbank.fr). cert-manager must be installed on the cluster.
# All use DNS-01 (Cloudflare): works for non-public DNS. Create Secret: kubectl create secret generic cloudflare-api-token -n cert-manager --from-literal=api-token=YOUR_CF_API_TOKEN
# nbank: production. nbank-staging / nbank-dev: Let's Encrypt staging.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank
spec:
  acme:
    email: amiladi@nbank.fr
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            email: amiladi@nbank.fr
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank-staging
spec:
  acme:
    email: amiladi@nbank.fr
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-staging-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            email: amiladi@nbank.fr
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nbank-dev
spec:
  acme:
    email: miladi.medamine@gmail.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: nbank-dev-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            email: miladi.medamine@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
