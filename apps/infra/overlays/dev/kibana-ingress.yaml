# Explicit sandbox Ingress — bitnami chart still publishes kibana.mifos.gazelle.test.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-sandbox
  namespace: infra
  annotations:
    cert-manager.io/cluster-issuer: nbank-dev
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kibana.api.dev.sandbox.internal.nbank.fr
      secretName: kibana-dev-tls
  rules:
    - host: kibana.api.dev.sandbox.internal.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-kibana
                port:
                  number: 5601
