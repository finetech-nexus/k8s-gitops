# Dev: minimal resources, single replica, no auth/TLS (fast local/dev).
global:
  kibanaEnabled: true

mongodb:
  enabled: false
mongo-express:
  enabled: false
redis:
  enabled: false
mysql:
  enabled: false
redpanda-console:
  enabled: false
console:
  enabled: false

kafka:
  enabled: true
  fullnameOverride: kafka
  persistence:
    enabled: true
    size: 1Gi
  broker:
    replicaCount: 1
    heapOpts: "-Xms64M -Xmx256M"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  extraConfig: |
    auto.create.topics.enable=true
    offsets.topic.replication.factor=1
  listeners:
    client:
      protocol: PLAINTEXT
      advertisedListeners: PLAINTEXT://kafka:9092
    interBroker:
      protocol: PLAINTEXT
      advertisedListeners: PLAINTEXT://kafka:9092
  auth:
    enabled: false
  zookeeper:
    enabled: true
    fullnameOverride: zookeeper
    replicaCount: 1
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  controller:
    replicaCount: 0
  provisioning:
    enabled: true
    numPartitions: 1
    replicationFactor: 1
    topics: []

elasticsearch:
  enabled: true
  master:
    replicaCount: 1
    masterOnly: false
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "400m"
  data:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0
  security:
    tls:
      restEncryption: false
  ingress:
    enabled: false
  kibana:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: false
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    ingress:
      enabled: false
