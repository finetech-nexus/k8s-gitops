apiVersion: apps/v1
kind: Deployment
metadata:
  name: produit-app
  labels:
    app: produit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: produit-app
  template:
    metadata:
      labels:
        app: produit-app
    spec:
      containers:
        - name: produit-app
          image: nexusbank/produit-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://core-api-produit-api.api.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
