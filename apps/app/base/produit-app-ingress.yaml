apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: produit-app
  annotations:
    cert-manager.io/cluster-issuer: nbank-dev
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - produit-app.dev.sandbox.internal.nbank.fr
      secretName: produit-app-dev-tls
  rules:
    - host: produit-app.dev.sandbox.internal.nbank.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: produit-app
                port:
                  number: 80
