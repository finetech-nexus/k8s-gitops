apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - functional-perimeters.yaml
  - helmrelease-kube-prom-stack.yaml
  - prometheus-rules-functional.yaml
  - business-exporter/deployment.yaml
  - grafana-dashboards/kong-dashboard.yaml
  - grafana-dashboards/perimeter-overview.yaml
  - grafana-dashboards/kyc-funnel.yaml
  - grafana-dashboards/functional-ops.yaml
  - grafana-dashboards/functional-users.yaml
  - grafana-dashboards/technical-cluster.yaml
  - grafana-dashboards/technical-apis.yaml
configMapGenerator:
  - name: business-exporter
    files:
      - exporter.py=business-exporter/exporter.py
    options:
      disableNameSuffixHash: true
