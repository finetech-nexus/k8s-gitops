apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-technical-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Technique
data:
  technical-cluster.json: |-
    {
      "title": "Technique — cluster & nodes",
      "uid": "technical-cluster",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["technical", "cluster", "prometheus"],
      "panels": [
        {
          "type": "stat",
          "title": "Targets up",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(up == 1)", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "Targets down",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(up == 0) or vector(0)", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "Firing alerts",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "Pods not ready",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_pod_status_ready{condition=\"false\"}) or vector(0)", "refId": "A"}]
        },
        {
          "type": "timeseries",
          "title": "Node CPU %",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
            "legendFormat": "{{instance}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "Node memory %",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
            "legendFormat": "{{instance}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "Pod restarts (1h) — all namespaces",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total[1h])) > 0",
            "legendFormat": "{{namespace}}",
            "refId": "A"
          }]
        }
      ]
    }
