apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kong
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kong-dashboard.json: |-
    {
      "__inputs": [],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus"
        }
      ],
      "title": "Kong API Gateway Metrics",
      "uid": "kong-dashboard",
      "timezone": "browser",
      "schemaVersion": 37,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Kong Request Count",
          "targets": [
            {
              "expr": "rate(kong_http_requests_total[1m])",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Kong Request Latency (p99)",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(kong_latency_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Kong Upstream Latency (p95)",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(kong_upstream_latency_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Kong Gateway Status Codes",
          "targets": [
            {
              "expr": "sum(rate(kong_http_status{code=~\"2..\"}[5m]))",
              "legendFormat": "2xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(kong_http_status{code=~\"4..\"}[5m]))",
              "legendFormat": "4xx",
              "refId": "B"
            },
            {
              "expr": "sum(rate(kong_http_status{code=~\"5..\"}[5m]))",
              "legendFormat": "5xx",
              "refId": "C"
            }
          ],
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }
        }
      ]
    }
