apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.8.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Cluster-wide metrics; Grafana dashboards filter by functional perimeter (namespace groups).
    prometheus:
      prometheusSpec:
        retention: 15d
        externalLabels:
          cluster: sandbox-dev
          env: sandbox
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        podMonitorSelector: {}
        ruleNamespaceSelector: {}
        ruleSelector: {}
        # Gateway perimeter (Kong status /metrics via prometheus plugin).
        additionalScrapeConfigs:
          - job_name: kong-gateway
            metrics_path: /metrics
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - apim
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: kong
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: ${1}:8100
              - target_label: functional_perimeter
                replacement: gateway
          - job_name: business-exporter
            metrics_path: /metrics
            scrape_interval: 30s
            static_configs:
              - targets:
                  - business-exporter.monitoring.svc.cluster.local:9105
                labels:
                  functional_perimeter: platform
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        # Hetzner CSI rejects operator PVC labels (ProvisioningFailed).
        # emptyDir is fine for sandbox retention; swap back to PVC when nodes grow.
        storageSpec:
          emptyDir: {}

    # Alertmanager is shipped by kube-prometheus-stack (routes PrometheusRule firings).
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    # Built-in k8s/node/prometheus recording+alerting rules (→ Alertmanager).
    defaultRules:
      create: true

    grafana:
      enabled: true
      adminUser: admin
      adminPassword: grafanaSandb0x
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: browser
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          # false → honour grafana_folder annotation (functional dashboards).
          provider:
            foldersFromFilesStructure: false
        datasources:
          enabled: true
          searchNamespace: ALL
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: nbank-dev
        hosts:
          - grafana.api.dev.sandbox.internal.nbank.fr
        tls:
          - secretName: grafana-dev-tls
            hosts:
              - grafana.api.dev.sandbox.internal.nbank.fr
      # Logs stay in ES (TN/EU residency); query by functional_perimeter field in Kibana/Grafana Explore.
      additionalDataSources:
        - name: Logs-TN
          type: elasticsearch
          access: proxy
          url: http://infra-elasticsearch.infra.svc.cluster.local:9200
          basicAuth: true
          basicAuthUser: elastic
          secureJsonData:
            basicAuthPassword: elasticSearchPas42
          jsonData:
            # Fluent Bit Logstash prefix; ES 8 may expose as data stream (.ds-logs-tn-*).
            index: "logs-tn-*"
            timeField: "@timestamp"
            esVersion: "8.0.0"
            logMessageField: message
            logLevelField: level
            includeFrozen: false
            maxConcurrentShardRequests: 5
      grafana.ini:
        server:
          root_url: https://grafana.api.dev.sandbox.internal.nbank.fr
        users:
          default_theme: dark
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
