apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ""   # optional pin (e.g. "65.0.0")
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
  targetNamespace: monitoring
  values:
    # Allow Prometheus to discover ServiceMonitors across namespaces
    prometheus:
      prometheusSpec:
        serviceMonitorNamespaceSelector: {}   # selects all namespaces
        serviceMonitorSelector: {}            # selects all ServiceMonitors

    # Enable Grafana sidecar so it picks up dashboards from ConfigMaps
    grafana:
      enabled: true
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          searchNamespace: ALL
        datasources:
          enabled: true
          searchNamespace: ALL
