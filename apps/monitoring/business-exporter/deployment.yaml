apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: business-exporter
    nexus.bank/functional-perimeter: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: business-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9105"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: exporter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9105
          env:
            - name: CLARITY_URL
              value: http://clarity-api.kyc-aml.svc.cluster.local:8095
            - name: CLARITY_USER
              value: admin
            - name: CLARITY_PASSWORD
              value: password
            - name: ES_URL
              value: http://infra-elasticsearch.infra.svc.cluster.local:9200
            - name: ES_USER
              value: elastic
            - name: ES_PASSWORD
              value: elasticSearchPas42
            - name: MT_API_URL
              value: http://core-api-mt-api.api.svc.cluster.local
            - name: METRICS_WINDOW
              value: "30d"
            - name: SCRAPE_SECONDS
              value: "60"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: script
          configMap:
            name: business-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: business-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: business-exporter
    nexus.bank/functional-perimeter: platform
spec:
  selector:
    app.kubernetes.io/name: business-exporter
  ports:
    - name: metrics
      port: 9105
      targetPort: metrics