# Dev overlay — TLS via cert-manager. Basic auth: set ingress.basicAuth.password (stored in cluster ConfigMap — prefer private overlay / SOPS for prod).
replicaCount: 1

image:
  repository: nexusbank/docs
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
    # Bare https://docs.nbank.fr/ → introduction
    nginx.ingress.kubernetes.io/app-root: /docs/3.0/index/
  basicAuth:
    enabled: true
    secretName: docs-basic-auth
    realm: "Nexus Bank Docs"
    username: docs
    # Non-empty: chart creates Secret docs-basic-auth (bcrypt). Empty: create secret manually (see scripts/create-docs-basic-auth-secret.sh).
    password: ""
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
