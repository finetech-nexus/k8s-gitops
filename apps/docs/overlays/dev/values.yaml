# Dev overlay — align image tag with your registry; TLS via cert-manager (ClusterIssuer).
replicaCount: 1

image:
  repository: ghcr.io/finetech-nexus/nexus-bank-docs
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
