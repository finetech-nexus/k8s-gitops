# Dev overlay — TLS via cert-manager. Basic auth: set ingress.basicAuth.password (chart creates Secret when non-empty).
replicaCount: 1

image:
  repository: nexusbank/docs
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  basicAuth:
    enabled: true
    secretName: docs-basic-auth
    realm: "Nexus Bank Docs"
    username: docs
    password: ""
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
