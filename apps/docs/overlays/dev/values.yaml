# Dev overlay — TLS via cert-manager.
replicaCount: 1

# Must match Dockerfile CMD `serve` listening on 8080.
containerPort: 8080
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Probes: port 8080 numeric (matches `serve`). Named port "http" can fail probe resolution on some setups.
# startupProbe: delay liveness until something listens (avoid NotReady while serve prints banner).
startupProbe:
  tcpSocket:
    port: 8080
  periodSeconds: 2
  failureThreshold: 30
  timeoutSeconds: 2
readinessProbe:
  tcpSocket:
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6
livenessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 3

image:
  repository: nexusbank/docs
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  basicAuth:
    enabled: false
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
