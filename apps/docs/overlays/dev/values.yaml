# Dev overlay — TLS via cert-manager.
replicaCount: 1

image:
  repository: nexusbank/docs
  tag: latest
  pullPolicy: Always

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Match docusaurus baseUrl when CF_PAGES is unset (Docker / k8s). Probing / returns 404 → Readiness fails.
readinessProbe:
  httpGet:
    path: /docs/3.0/
    port: http
  initialDelaySeconds: 8
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /docs/3.0/
    port: http
  initialDelaySeconds: 25
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  basicAuth:
    enabled: false
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
