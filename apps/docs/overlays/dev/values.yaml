# Dev overlay — TLS via cert-manager.
replicaCount: 1

image:
  repository: nexusbank/docs
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  basicAuth:
    enabled: false
  hosts:
    - host: docs.nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - docs.nbank.fr
      secretName: docs-nbank-fr-tls
