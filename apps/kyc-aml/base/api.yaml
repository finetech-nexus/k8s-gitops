apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clarity-uploads
  namespace: kyc-aml
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clarity-api
  namespace: kyc-aml
  labels:
    app: clarity-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clarity-api
  template:
    metadata:
      labels:
        app: clarity-api
    spec:
      containers:
        - name: clarity-api
          image: nexusbank/clarity-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8095
          env:
            - name: CLARITY_DATABASE_URL
              value: sqlite:////var/lib/clarity/uploads/clarity.db
            - name: CLARITY_ENV
              value: development
            - name: CLARITY_SEED_DEMO
              value: "true"
            - name: CLARITY_SEED_CLIENTS
              value: "false"
            - name: CLARITY_JWT_SECRET
              value: clarity-kyc-aml-sandbox-jwt-secret-32b
            - name: CLARITY_UPLOAD_DIR
              value: /var/lib/clarity/uploads
            - name: CLARITY_PUBLIC_APP_URL
              value: https://clarity.api.dev.sandbox.internal.nbank.fr
            - name: CLARITY_CORE_BANKING_HOOK_URL
              value: http://core-api-core-banking-api.api.svc.cluster.local/api/kyc/onboarding
            - name: CLARITY_ADMIN_USERNAME
              value: admin
            - name: CLARITY_ADMIN_PASSWORD
              value: password
            - name: CLARITY_AUTH_MODE
              value: oidc
            - name: CLARITY_OIDC_ISSUER
              value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal
            - name: CLARITY_OIDC_CLIENT_ID
              value: web-app
            - name: CLARITY_OIDC_ADMINS
              value: mifos
            - name: CLARITY_OIDC_REDIRECT_URI
              value: https://clarity.api.dev.sandbox.internal.nbank.fr/api/clarity/v1/auth/oidc/callback
            - name: CLARITY_FACE_API_URL
              value: http://core-api-ai-api.api.svc.cluster.local
            - name: CLARITY_CORS_ORIGINS
              value: https://clarity.api.dev.sandbox.internal.nbank.fr,http://localhost:3010
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/clarity/uploads
          readinessProbe:
            httpGet:
              path: /api/v1/_health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/_health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 8Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: clarity-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: clarity-api
  namespace: kyc-aml
  labels:
    app: clarity-api
spec:
  type: ClusterIP
  selector:
    app: clarity-api
  ports:
    - name: http
      port: 8095
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clarity-api
  namespace: kyc-aml
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    cert-manager.io/cluster-issuer: nbank-dev
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clarity-api.api.dev.sandbox.internal.nbank.fr
      secretName: clarity-api-dev-tls
  rules:
    - host: clarity-api.api.dev.sandbox.internal.nbank.fr
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: clarity-api
                port:
                  number: 8095
