# Nexus Bank API from OCI: ghcr.io/finetech-nexus/nexus-bank-api-chart/nexus-bank-app
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexus-bank-api
  namespace: api
spec:
  interval: 5m
  chart:
    spec:
      chart: nexus-bank-app
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: nexus-bank-api-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: nexus-bank-api-values
      valuesKey: values.yaml
