apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api
resources:
  - ../../base
configMapGenerator:
  - name: core-banking-api-values
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=values-core-banking-api.yaml
  - name: ca-config-map
    options:
      disableNameSuffixHash: true
    files:
      - ca.pem=ca.pem
