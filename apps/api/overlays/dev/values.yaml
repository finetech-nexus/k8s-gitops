  env:
    KEYCLOAK_URL: "https://iam.dev.sandbox.internal.nbank.fr/auth"
    KEYCLOAK_REALM: "customer"
    KEYCLOAK_CLIENT_ID: "cbanking-api-oidc"
    KEYCLOAK_CLIENT_SECRET: "Mh26ufWhUWLGabGsC84zNzmw26xLTp5U"
    SUBJECT_ISSUER: "global-oidc"
    KEYCLOAK_ADMIN_CLIENT_ID: "cbanking-registration-api-oidc"
    KEYCLOAK_ADMIN_CLIENT_SECRET: "urY34FtvS2K4QtTo7xhjMZAx63n7khNg"
    KEYCLOAK_INTERNAL_REALM: "internal"
    KEYCLOAK_FINERACT_CLIENT_ID: "cbanking-api-oidc"
    KEYCLOAK_FINERACT_CLIENT_SECRET: "Iu8NODQxGQgPP0cYtDK3ZF3vEBzJ6nRs"
    KEYCLOAK_FINERACT_USERNAME: "mifos"
    KEYCLOAK_FINERACT_PASSWORD: "password"
    FINERACT_BASE_URL: "https://fynams.dev.sandbox.internal.nbank.fr"
    FINERACT_BASE_PATH: "/fineract-provider/api/v1"
    FINERACT_TENANT: "nexusbank"
    DEFAULT_SAVING_PRODUCT: 3
    SAVING_PRODUCTS:
      TND: "3"
      EURO: "2"
      USD: "1"
    OFFICE_ID: 2
    SWIFT_BIC: "NEXUSTN"
    BANK_CODE: "30000000"
    COUNTRY_CODE: "TN"


  extraEnv: |
    - name: CHANNEL_BASE_URL
      value: https://channel.payment-hub.dev.sandbox.internal.nbank.fr
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/certificate/ca.pem
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
    - name: GLOBAL_KEYCLOAK_URL
      value: "https://iam.dev.sandbox.internal.nbank.fr/auth"
    - name: GLOBAL_KEYCLOAK_REALM
      value: "global"
    - name: GLOBAL_KEYCLOAK_CLIENT_ID
      value: "nexusbank-registration-app-oidc" 
    - name: GLOBAL_KEYCLOAK_CLIENT_SECRET
      value: "cZdzGmXkkgGOxOMoUgQozP0xPdSEV8Rh"
    - name: TENANT
      value: "tn" 
#generate another client or kafka client for best resilience
  extraVolumes:
    - name: certificate
      configMap:
        name: ca-config-map
  extraVolumeMounts:
    - name: certificate
      mountPath: /etc/certificate
      readOnly: true

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-buffers: "416k"
      cert-manager.io/cluster-issuer: nbank-dev
    hosts:
      - host: cbanking-api.api.dev.sandbox.internal.nbank.fr
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - cbanking-api.api.dev.sandbox.internal.nbank.fr
        secretName: cbanking-api-dev-tls

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}


  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10


