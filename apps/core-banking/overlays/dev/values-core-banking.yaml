fineract:
  enabled: true
  db: fineract-mysql
  DFSPIDS: "nexus-bank"
  SPRING_PROFILES_ACTIVE: "bb"
  image: "docker.io/nexusbank/fineract:1.14.1"
  replicas: 1
#  hostAliases:
#    - ip: "172.18.0.3"
#      hostnames:
#        - "iam.nexus-bank.io"
#        - "apim.nexus-bank.io"
#        - "hooks-api.sandbox.nexus-bank.io"
#        - "cbanking-api.sandbox.nexus-bank.io"
  extraInitContainers:
    - name: init-mydb
      image: alpine:3.18
      command: [ 'sh', '-c', 'echo -e "Checking for the availability of MYSQL server deployment"; while ! nc -z "{{ .Values.fineract.spec.template.spec.containers.env.FINERACT_DEFAULT_TENANTDB_HOSTNAME }}" "{{ .Values.fineract.spec.template.spec.containers.env.FINERACT_DEFAULT_TENANTDB_PORT }}"; do sleep 1; printf "-"; done; echo -e " >> MYSQL server has started";' ]
  spec:
    template:
       spec:
         containers:
            env:
              FINERACT_DEFAULT_TENANTDB_IDENTIFIER: "default"
              FINERACT_DEFAULT_TENANTDB_NAME: "fineract_default"
              FINERACT_DEFAULT_TENANTDB_HOSTNAME: "fineract-mysql"
              FINERACT_DEFAULT_TENANTDB_PORT: "3306"
              FINERACT_HIKARI_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
              FINERACT_HIKARI_JDBC_URL: jdbc:mariadb://fineract-mysql:3306/fineract_tenants
              FINERACT_SERVER_PORT: 8443
              FINERACT_SECURITY_BASICAUTH_ENABLED: false
              FINERACT_SECURITY_OAUTH_ENABLED: true
             # FINERACT_SECURITY_OAUTH_ISSUER_URI: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal
            #  FINERACT_SECURITY_OAUTH_JWK_SET_URI: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal/protocol/openid-connect/certs
             # FINERACT_SERVER_OAUTH_RESOURCE_URL: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal
  preStopScript: 'echo -e "******Fineract is stopping********";'
  ingress:
    enabled: true
    hostname: "fynams.dev.sandbox.internal.nbank.fr"
    path: "/"
    wildcardhostname: "fynams.dev.sandbox.internal.nbank.fr"
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://web-app.dev.sandbox.internal.nbank.fr"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PUT, DELETE"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, fineract-platform-tenantid"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
  resources:
    limits:
      cpu: "1000m"
      memory: "4Gi"
    requests:
      cpu: "200m"
      memory: "2Gi"
  deployment:
    extraEnvs:
      - name: FINERACT_SECURITY_OAUTH_ALLOWED_ISSUERS
        value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal,https://iam.nexus-bank.io/auth/realms/customer
      - name: JAVA_TOOL_OPTIONS
        value: >
          -Xms1024m -Xmx2048m
          -Djavax.net.ssl.trustStore=/etc/truststore/truststore.jks
          -Djavax.net.ssl.trustStorePassword=password
          -Dlog.level=INFO
      - name: LOGGING_LEVEL_ROOT
        value: INFO
      - name: LOGGING_LEVEL_ORG_APACHE_FINERACT_INFRASTRUCTURE_EVENT
        value: INFO
      - name: LOGGING_LEVEL_ORG_APACHE_FINERACT_INFRASTRUCTURE_SECURITY
        value: INFO
      - name: LOGGING_LEVEL_ORG_APACHE_FINERACT
        value: INFO
      - name: LOGGING_LEVEL_COM_ZAXXER_HIKARI
        value: INFO
      - name: FINERACT_EXTERNAL_EVENTS_ENABLED
        value: "true"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_ENABLED
        value: "true"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_BOOTSTRAP_SERVERS
        value: "kafka.infra.svc.cluster.local:9092"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_TOPIC_NAME
        value: "savings-events"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_TOPIC_REPLICAS
        value: "1"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_TOPIC_PARTITIONS
        value: "1"
      - name: FINERACT_EXTERNAL_EVENTS_KAFKA_TOPIC_AUTO_CREATE
        value: "true"
    extraVolumes:
      - name: truststore
        secret:
          secretName: truststore
    extraVolumeMounts:
      - name: truststore
        mountPath: /etc/truststore
        readOnly: true
    truststore: ''
webapp:
  enabled: true
  image: "docker.io/nexusbank/web-app:dev"
  ingress:
    enabled: true
    hostname: "web-app.dev.sandbox.internal.nbank.fr"
    path: "/"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: nbank-dev
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  deployment:
    extraEnvs:
      - name: FINERACT_API_URLS
        value: 'https://fynams.dev.sandbox.internal.nbank.fr'
      - name: FINERACT_API_URL
        value: 'https://fynams.dev.sandbox.internal.nbank.fr'
      - name: FINERACT_API_PROVIDER
        value: '/fineract-provider/api'
      - name: FINERACT_API_ACTUATOR
        value: '/fineract-provider'
      - name: FINERACT_API_VERSION
        value: '/v1'
      - name: MIFOS_DISPLAY_TENANT_SELECTOR
        value: 'true'
      - name: FINERACT_PLATFORM_TENANTS_IDENTIFIER
        value: "nexusbank,default"
      - name: FINERACT_PLATFORM_TENANT_IDENTIFIER
        value: "nexusbank"
      - name: MIFOS_OAUTH_SERVER_ENABLED
        value: 'true'
      - name: FINERACT_PLUGIN_OIDC_ENABLED
        value: 'false'
      # IdP issuer URL for OAuth2 discovery (Keycloak). Discovery loads from here; userdetails use MIFOS_OAUTH_SERVER_URL (Fineract).
      - name: MIFOS_OAUTH_ISSUER_URL
        value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal
      - name: MIFOS_OAUTH_SERVER_URL
        value: https://fynams.dev.sandbox.internal.nbank.fr/fineract-provider/api/v1
      - name: MIFOS_OAUTH_AUTHORIZE_URL
        value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal/protocol/openid-connect/auth
      - name: MIFOS_OAUTH_TOKEN_URL
        value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal/protocol/openid-connect/token
      - name: MIFOS_OAUTH_SERVER_LOGOUT_URL
        value: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal/protocol/openid-connect/logout
      - name: MIFOS_OAUTH_CLIENT_ID
        value: web-app
      - name: MIFOS_OAUTH_REDIRECT_URI
        value: https://web-app.dev.sandbox.internal.nbank.fr/callback
      - name: MIFOS_OAUTH_SCOPE
        value: openid
        #Enable or Disable HTTP Cache
      - name: MIFOS_HTTP_CACHE_ENABLED
        value: 'false'
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: '0'


mysql:
  fullnameOverride: fineract-mysql
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: "10.5.16-debian-11-r22"
    debug: true
  auth:
    username: "mifos"
    password: "password"
    rootPassword: "4ET6ywqlGt"
  initdbScripts:
    setup.sql: |-
      # create databases
      CREATE DATABASE IF NOT EXISTS `fineract_tenants`;
      CREATE DATABASE IF NOT EXISTS `fineract_default`;
      # create root user and grant rights
      GRANT ALL ON *.* TO 'root'@'%';
      GRANT ALL PRIVILEGES ON `fineract_tenants`.* TO 'mifos';
      GRANT ALL PRIVILEGES ON `fineract_default`.* TO 'mifos';
  primary:
    resources:
      requests:
        memory: "0.5Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

wildcardhostname: "*.dev.sandbox.internal.nbank.fr"
webapptls: "webapp-tls"
fineracttls: "fineract-tls"
certificate:
  enabled: true
  issuerRef: nbank-dev  # from apps/cert-manager/cluster-issuers.yaml (DNS-01). Or nbank-dev-selfsigned if no ACME.
post_installation_job:
  enabled: true
  tenants: "nexusbank,nexusbankfr"
