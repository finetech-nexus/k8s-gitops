# Dev values for fineract-hook-chart (tune as needed)
replicaCount: 1
#hostAliases:
#  - ip: "172.18.0.3"
#    hostnames:
#      - "iam.nexus-bank.io"
image:
  repository: docker.io/nexusbank/fineract-hook-api
  tag: "latest"
  pullPolicy: Always

env:
  KEYCLOAK_URL: "https://iam.dev.sandbox.internal.nbank.fr/auth"
  KEYCLOAK_REALM: "global"


extraEnv: |
  - name: BROKER_TOPIC_TRANSACTIONS
    value: "transactions"
  - name: BROKER_TOPIC_NOTIFICATION_TRANSACTION
    value: "notification.transaction"
  - name: BROKER_TOPIC_NOTIFICATION_PAYMENT_CONFIRMATION
    value: "notification.payment-confirmation"
  - name: BROKER_TOPIC_NOTIFICATION_ACCOUNT
    value: "notification.account"
  - name: BROKER_TOPIC_NOTIFICATION_CARD
    value: "notification.card"
  - name: BROKER_SERVER
    value: kafka.infra.svc.cluster.local:9092
  - name: KAFKA_CLIENT_ID
    value: fineract-producer
  - name: FINERACT_TENANT
    value: tn
  - name: DEPLOYED_AT
    value: "2026-10-13T17:51:00Z"
  
  

extraVolumes:
  - name: certificate
    configMap:
      name: fineract-hook-api-ca-cm
extraVolumeMounts:
  - name: certificate
    mountPath: /etc/certificate
    readOnly: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: nbank-dev
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-buffers: "416k"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-websocket: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"          # disable HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  hosts:
    - host: hooks-api.dev.sandbox.internal.nbank.fr
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - hooks-api.dev.sandbox.internal.nbank.fr
      secretName: hooks-api-dev-tls

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}


livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
