# Core API from GHCR OCI: ghcr.io/finetech-nexus/core-banking-api-chart/core-api
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-api
  namespace: api-eu
spec:
  suspend: true
  interval: 5m
  chart:
    spec:
      chart: core-api
      version: "0.2.4"
      sourceRef:
        kind: HelmRepository
        name: core-api-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: core-api-values
      valuesKey: values.yaml
