apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api-eu
resources:
  - ../../base
configMapGenerator:
  - name: core-api-values
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=values.yaml
  - name: ca-config-map
    options:
      disableNameSuffixHash: true
    files:
      - ca.pem=ca.pem
  - name: kyc-ca-config-map
    options:
      disableNameSuffixHash: true
    files:
      - ca.pem=ca.pem
