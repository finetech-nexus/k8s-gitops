# Fineract Hook API — from GHCR OCI (fineract-hook-chart-oci). Chart name from Chart.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fineract-hook
  namespace: core-banking-eu
spec:
  suspend: true
  interval: 5m
  chart:
    spec:
      chart: fineract-hook
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: fineract-hook-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: fineract-hook-values
      valuesKey: values.yaml
