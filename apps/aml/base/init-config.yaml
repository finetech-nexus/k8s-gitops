                    field("screening_type", "Screening type", "String", False, "enum"),
                    field("status", "Status", "String", False, "enum"),
                    field("review_reason", "Review reason", "String", True),
                ]
            ),
            [link_to("customer", "customer_id", clients_id)],
        )
    )
    ensure_table(
        table(
            "risk_assessments",
            "Risk assessments",
            "event",
            "updated_at",
            base_fields(
                [
                    field("customer_id", "Customer", "String", False, "foreign_key"),
                    field("assessment_type", "Assessment type", "String", False, "enum"),
                    field("score", "Score", "Float", False),
                    field("risk_level", "Risk level", "String", False, "enum"),
                    field("model_version", "Model version", "String", False),
                    field("assessed_at", "Assessed at", "Timestamp", False),
                    field("valid_until", "Valid until", "Timestamp", True),
                    field("reason", "Reason", "String", True),
                ]
            ),
            [link_to("customer", "customer_id", clients_id)],
        )
    )

    def ensure_scenario(name, description, trigger):
        _, found = api("GET", "/scenarios")
        if any(item.get("name") == name for item in (found or [])):
            print(f"scenario {name} already present")
            return
        print(f"creating scenario {name}")
        _, created = api(
            "POST",
            "/scenarios",
            {"name": name, "description": description, "trigger_object_type": trigger},
        )
        watched = "full_name" if trigger == "clients" else "currency"
        try:
            api(
                "POST",
                "/scenario-iterations",
                {
                    "scenario_id": created["id"],
                    "body": {
                        "trigger_condition_ast_expression": None,
                        "score_review_threshold": 30,
                        "score_block_and_review_threshold": 80,
                        "score_decline_threshold": 100,
                        "schedule": "",
                        "rules": [
                            {
                                "display_order": 1,
                                "name": "Record is present",
                                "description": description,
                                "formula_ast_expression": {
                                    "name": "IsNotEmpty",
                                    "children": [payload(watched)],
                                },
                                "score_modifier": 1,
                                "rule_group": "aml",
                            }
                        ],
                    },
                },
            )
        except SystemExit as error:
            print(f"scenario {name} saved without an iteration: {error}")

    for name, description, trigger in [
        ("AML-001 Fractionnement des opérations", "Detect repeated operations whose combined amount is unusual.", "transactions"),
        ("AML-002 Hausse inhabituelle du volume", "Compare the current volume with the client's history or expected profile.", "transactions"),
        ("AML-003 Fréquence inhabituelle", "Compare the number of operations with the client's usual frequency.", "transactions"),
        ("AML-004 Montant individuel atypique", "Compare one operation amount with the client's usual amount.", "transactions"),
        ("AML-005 Anomalies liées aux espèces", "Review cash operations whose count or total is unusual.", "transactions"),
        ("AML-006 Opérations proches d'un seuil interne", "Review operations close to an internal bank threshold.", "transactions"),
        ("AML-007 Entrées suivies de sorties rapides", "Review incoming funds that leave again within a short delay.", "transactions"),
        ("AML-008 Circulation circulaire des fonds", "Review funds that can return to their origin.", "transactions"),
        ("AML-009 Comptes intermédiaires multiples", "Review funds that pass through several accounts.", "transactions"),
        ("AML-010 Concentration puis redistribution", "Review funds gathered from several sources and sent to several beneficiaries.", "transactions"),
        ("AML-011 Rotation élevée des fonds", "Review a high volume relative to the available balance or inflows.", "transactions"),
        ("AML-012 Nombre inhabituel de contreparties", "Review a high number of distinct counterparties.", "transactions"),
        ("AML-013 Plusieurs clients vers un même bénéficiaire", "Review several clients sending funds to the same beneficiary.", "transactions"),
        ("AML-014 Réseau de comptes ou clients liés", "Review a group of clients linked by confirmed relationships or transactions.", "transactions"),
        ("AML-015 Modification inhabituelle des bénéficiaires", "Review beneficiaries that are new for the client.", "transactions"),
        ("AML-016 Juridictions à risque", "Review operations involving a country on the bank's dated reference list.", "transactions"),
        ("AML-017 Activité internationale inhabituelle", "Review an unusual number of countries compared with the known profile.", "transactions"),
        ("AML-018 Changement rapide de destinations", "Review new destination countries over a short period.", "transactions"),
        ("AML-019 Reprise d'activité après inactivité", "Review the first operation after a dormant period.", "transactions"),
        ("AML-020 Incohérence avec le profil KYC", "Review activity that departs from the known KYC profile.", "clients"),
        ("AML-021 Forte activité sur un compte récent", "Review a high volume shortly after an account is opened.", "transactions"),
        ("AML-022 Changement inhabituel de canal", "Review a channel that differs from the client's history.", "transactions"),
        ("AML-023 Nouveau résultat de screening", "Review a new or changed screening result. A name similarity is not a confirmed identity.", "clients"),
        ("AML-024 KYC incomplet ou obsolète", "Review a missing, expired or overdue KYC profile.", "clients"),
        ("AML-025 Changement matériel du profil client", "Review a material change between two versions of the client profile.", "clients"),
    ]:
        ensure_scenario(name, description, trigger)

    print("Marble AML configuration is ready")
