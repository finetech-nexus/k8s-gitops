apiVersion: batch/v1
kind: Job
metadata:
  name: marble-init-aml-12
  namespace: aml
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until curl -sf http://marble-api:8080/liveness; do echo waiting for Marble API; sleep 5; done
      containers:
        - name: init
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - apk add --no-cache postgresql-client && pip install -q google-auth requests && python -u /config/init.py
          env:
            - name: PGHOST
              value: marble-postgresql
            - name: PGDATABASE
              value: marble
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
            - name: MARBLE_API
              value: http://marble-api:8080
            - name: FIREBASE_API_KEY
              value: AIzaSyA4AnXx9RrDpAzl4D0msERm629zVgS8GOM
            - name: FIREBASE_PROJECT_ID
              value: marble-a1227
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/firebase/service-account.json
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: admin-password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: marble-init
        - name: firebase-credentials
          secret:
            secretName: marble
            items:
              - key: firebase-service-account.json
                path: service-account.json
