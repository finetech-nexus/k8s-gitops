# Runs after the API is up. Creates the org, the client screening scenario, and the transaction scenario.
apiVersion: v1
kind: ConfigMap
metadata:
  name: marble-init
  namespace: aml
data:
  init.py: |
    import atexit
    import hashlib
    import json
    import os
    import secrets
    import subprocess
    import time
    import urllib.error
    import urllib.request

    API = os.environ["MARBLE_API"].rstrip("/")
    API_KEY = os.environ["FIREBASE_API_KEY"]
    PROJECT = os.environ["FIREBASE_PROJECT_ID"]
    EMAIL = os.environ["ADMIN_EMAIL"]
    PASSWORD = os.environ["ADMIN_PASSWORD"]
    SCREENING = "AML screening"
    TRANSACTION = "AML transaction check"


    def call(method, url, body=None, token=None, ok=(200, 201), extra_headers=None):
        data = None if body is None else json.dumps(body).encode()
        headers = {"Content-Type": "application/json"}
        if extra_headers:
            headers.update(extra_headers)
        if token:
            headers["Authorization"] = "Bearer " + token
        request = urllib.request.Request(url, data=data, headers=headers, method=method)
        try:
            with urllib.request.urlopen(request, timeout=120) as response:
                raw = response.read().decode()
                parsed = json.loads(raw) if raw else None
                return response.status, parsed
        except urllib.error.HTTPError as error:
            raw = error.read().decode()
            if error.code not in ok:
                raise SystemExit(f"{method} {url} -> {error.code} {raw}")
            try:
                parsed = json.loads(raw) if raw else None
            except json.JSONDecodeError:
                parsed = raw
            return error.code, parsed


    def payload(field):
        return {"name": "Payload", "children": [{"constant": field}]}




    def field(name, alias, data_type, nullable, semantic=None):
        body = {
            "name": name,
            "description": alias,
            "type": data_type,
            "alias": alias,
            "nullable": nullable,
            "is_enum": False,
            "is_unique": False,
        }
        if semantic:
            body["semantic_type"] = semantic
        return body


    def table(name, alias, semantic_type, ordering, fields, links=None):
        body = {
            "name": name,
            "description": alias,
            "alias": alias,
            "semantic_type": semantic_type,
            "primary_ordering_field": ordering,
            "fields": fields,
            "links": links or [],
            "lifecycle": {"enabled": False},
        }
        return body


    def google_token():
        import google.auth.transport.requests
        from google.oauth2 import service_account

        creds = service_account.Credentials.from_service_account_file(
            os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
            scopes=["https://www.googleapis.com/auth/cloud-platform"],
        )
        creds.refresh(google.auth.transport.requests.Request())
        return creds.token


    def ensure_firebase_user():
        access = google_token()
        config_url = f"https://identitytoolkit.googleapis.com/v2/projects/{PROJECT}/config"
        _, current = call("GET", config_url, token=access, ok=(200, 404))
        domains = set()
        if isinstance(current, dict):
            domains.update(current.get("authorizedDomains") or [])
        domains.update(
            [
                "localhost",
                f"{PROJECT}.firebaseapp.com",
                f"{PROJECT}.web.app",
                "aml-app.dev.sandbox.nbank.fr",
                "aml-app.dev.sandbox.internal.nbank.fr",
            ]
        )
        call(
            "PATCH",
            config_url
            + "?updateMask=signIn.email.enabled,signIn.email.passwordRequired,authorizedDomains",
            {
                "signIn": {"email": {"enabled": True, "passwordRequired": True}},
                "authorizedDomains": sorted(domains),
            },
            token=access,
        )
        try:
            call(
                "POST",
                f"https://identitytoolkit.googleapis.com/v1/projects/{PROJECT}/accounts",
                {
                    "email": EMAIL,
                    "password": PASSWORD,
                    "emailVerified": True,
                    "displayName": "AML Admin",
                },
                token=access,
            )
            print("firebase user created")
        except SystemExit as error:
            if "EMAIL_EXISTS" not in str(error):
                raise
            print("firebase user already exists")


    print("configuring firebase")
    try:
        ensure_firebase_user()
    except (SystemExit, Exception) as error:
        print(f"firebase admin setup skipped: {error}")

    def psql(statement):
        completed = subprocess.run(
            ["psql", "-v", "ON_ERROR_STOP=1", "-tAc", statement],
            check=False,
            text=True,
            capture_output=True,
        )
        if completed.returncode != 0:
            detail = (completed.stderr or completed.stdout).strip()
            raise SystemExit(f"database command failed: {detail}")
        return completed.stdout.strip()


    def revoke_api_key():
        psql(
            "UPDATE marble.api_keys SET deleted_at = now() "
            "WHERE description = 'aml-init' AND deleted_at IS NULL"
        )


    def ensure_organization():
        org = psql(
            "SELECT organization_id::text FROM marble.users "
            "WHERE lower(email) = 'miladi.medamine@gmail.com' "
            "AND deleted_at IS NULL AND organization_id IS NOT NULL LIMIT 1"
        )
        if org:
            return org
        org = psql("SELECT id::text FROM marble.organizations WHERE deleted_at IS NULL ORDER BY name LIMIT 1")
        if not org:
            tenant = psql("INSERT INTO marble.tenants (id, name) VALUES (uuid_generate_v4(), 'Nexus Bank') RETURNING id::text")
            org = psql(
                "INSERT INTO marble.organizations (name, tenant_id) "
                f"VALUES ('Nexus Bank', '{tenant}') RETURNING id::text"
            )
            print("organization created")
        psql(
            "INSERT INTO marble.users (email, role, organization_id, first_name, last_name) VALUES "
            f"('aml-admin@nbank.fr', 4, '{org}', 'AML', 'Admin'), "
            f"('miladi.medamine@gmail.com', 4, '{org}', 'Medamine', 'Miladi') "
            "ON CONFLICT (email) DO UPDATE SET organization_id = EXCLUDED.organization_id, deleted_at = NULL, role = 4"
        )
        print("organization users ready")
        return org


    def open_api_key():
        ensure_organization()
        revoke_api_key()
        key = "aml" + secrets.token_hex(24)
        digest = hashlib.sha256(key.encode()).hexdigest()
        org = ensure_organization()
        psql(
            "INSERT INTO marble.api_keys (org_id, prefix, role, description, key_hash) "
            f"VALUES ('{org}', '{key[:3]}', 4, 'aml-init', decode('{digest}', 'hex'))"
        )
        print("temporary admin api key created")
        return key


    atexit.register(revoke_api_key)
    for attempt in range(36):
        present = psql("SELECT to_regclass('marble.api_keys')")
        if present:
            break
        print("waiting for marble.api_keys")
        time.sleep(5)
    else:
        raise SystemExit("marble.api_keys is missing after the database migrations")
    MARBLE_KEY = open_api_key()


    def api(method, path, body=None, ok=(200, 201)):
        return call(method, API + path, body, ok=ok, extra_headers={"X-API-Key": MARBLE_KEY})


    def tables():
        _, model = api("GET", "/data-model")
        if isinstance(model, dict) and isinstance(model.get("data_model"), dict):
            model = model["data_model"]
        return (model or {}).get("tables") or {}


    def field_names(table_item):
        names = set()
        fields = table_item.get("fields") or {}
        if isinstance(fields, dict):
            for key, value in fields.items():
                if isinstance(value, dict) and value.get("name"):
                    names.add(value["name"])
                else:
                    names.add(key)
        return names


    def ensure_table(spec):
        current = tables()
        existing = None
        for item in current.values():
            if item.get("name") == spec["name"]:
                existing = item
                break
        if existing is None:
            print(f"creating table {spec['name']}")
            _, created = api("POST", "/data-model/tables", spec, ok=(201,))
            return created["id"]
        print(f"table {spec['name']} already exists")
        present = field_names(existing)
        for column in spec["fields"]:
            if column["name"] in present:
                continue
            print(f"adding field {spec['name']}.{column['name']}")
            api("POST", f"/data-model/tables/{existing['id']}/fields", column, ok=(200, 201))
        return existing["id"]


    def datasets():
        try:
            _, catalog = api("GET", "/screenings/datasets")
        except SystemExit as error:
            print(f"dataset catalog unavailable, using us_sanctions: {error}")
            return ["us_sanctions"]
        names = []
        sections = catalog.get("sections") if isinstance(catalog, dict) else []
        for section in sections or []:
            for item in section.get("datasets") or []:
                value = item.get("name") if isinstance(item, dict) else ""
                if value:
                    names.append(value)
        picked = [name for name in names if "sanction" in name.lower() or "pep" in name.lower()]
        return picked[:8] or names[:3] or ["us_sanctions"]


    def screening_name(field_name):
        return {"name": "StringConcat", "children": [payload(field_name)]}


    def publish(iteration_id):
        _, report = api("POST", f"/scenario-iterations/{iteration_id}/validate")
        print("validation: " + json.dumps(report))
        api(
            "POST",
            f"/scenario-iterations/{iteration_id}/commit",
            ok=(200, 201, 204, 409),
        )
        api(
            "POST",
            "/scenario-publications",
            {"scenario_iteration_id": iteration_id, "publication_action": "publish"},
        )


    _, scenarios = api("GET", "/scenarios")
    existing = {item.get("name") for item in (scenarios or [])}

    screening = next((item for item in (scenarios or []) if item.get("name") == SCREENING), None)
    if screening and screening.get("live_version_id"):
        print("AML screening already present")
    else:
        ensure_table(
            table(
                "clients",
                "Clients",
                "person",
                "updated_at",
                [
                    field("object_id", "Object id", "String", False, "id"),
                    field("updated_at", "Updated at", "Timestamp", False, "last_update"),
                    field("full_name", "Full name", "String", False, "name"),
                    field("birth_date", "Birth date", "String", True),
                    field("nationality", "Nationality", "String", True, "country"),
                ],
            )
        )
        iteration = None
        committed = None
        if screening is None:
            print("creating AML screening scenario")
            _, screening = api(
                "POST",
                "/scenarios",
                {
                    "name": SCREENING,
                    "description": "Screen a customer against sanctions and PEP lists.",
                    "trigger_object_type": "clients",
                },
            )
        else:
            _, found = api("GET", "/scenario-iterations?scenario_id=" + screening["id"])
            for item in found or []:
                if item.get("version") is not None:
                    committed = item
                elif iteration is None:
                    iteration = item
        if committed is not None:
            print("AML screening is saved. Publishing it needs a Marble license that includes sanctions.")
        else:
            if iteration is None:
                _, iteration = api(
                    "POST",
                    "/scenario-iterations",
                    {
                        "scenario_id": screening["id"],
                        "body": {
                            "trigger_condition_ast_expression": None,
                            "score_review_threshold": 50,
                            "score_block_and_review_threshold": 80,
                            "score_decline_threshold": 100,
                            "schedule": "",
                            "rules": [
                                {
                                    "display_order": 1,
                                    "name": "Customer name is present",
                                    "description": "Keeps the scenario valid. A screening hit forces review.",
                                    "formula_ast_expression": {"name": "IsNotEmpty", "children": [payload("full_name")]},
                                    "score_modifier": 1,
                                    "rule_group": "screening",
                                }
                            ],
                        },
                    },
                )
            if not (iteration.get("body") or {}).get("screening_configs"):
                chosen = datasets()
                print(f"screening datasets: {chosen}")
                screening_body = {
                    "name": "AML person screening",
                    "description": "Sanctions and PEP screening of the customer name.",
                    "datasets": chosen,
                    "threshold": 70,
                    "forced_outcome": "review",
                    "entity_type": "Person",
                    "query": {"name": screening_name("full_name")},
                }
                try:
                    api("POST", f"/scenario-iterations/{iteration['id']}/screening", screening_body)
                except SystemExit as error:
                    print(f"dataset filter rejected, retrying without a dataset list: {error}")
                    screening_body.pop("datasets", None)
                    api("POST", f"/scenario-iterations/{iteration['id']}/screening", screening_body)
            try:
                publish(iteration["id"])
            except SystemExit as error:
                if "screening feature access is missing" not in str(error):
                    raise
                print("AML screening is saved. Publishing it needs a Marble license that includes sanctions.")

    transaction = next((item for item in (scenarios or []) if item.get("name") == TRANSACTION), None)
    if transaction and transaction.get("live_version_id"):
        print("AML transaction check already present")
    else:
        current = tables()
        clients_id = next(item["id"] for item in current.values() if item.get("name") == "clients")
        ensure_table(
            table(
                "transactions",
                "Transactions",
                "transaction",
                "updated_at",
                [
                    field("object_id", "Object id", "String", False, "id"),
                    field("updated_at", "Updated at", "Timestamp", False, "last_update"),
                    field("amount", "Amount", "Float", False, "monetary_amount"),
                    field("currency", "Currency", "String", True, "currency"),
                    field("country", "Country", "String", False, "country"),
                    field("client_id", "Client", "String", True, "foreign_key"),
                ],
                [
                    {
                        "name": "client",
                        "link_type": "belongs_to",
                        "child_field_name": "client_id",
                        "parent_table_id": clients_id,
                    }
                ],
            )
        )
        iteration = None
        if transaction is None:
            print("creating AML transaction check scenario")
            _, transaction = api(
                "POST",
                "/scenarios",
                {
                    "name": TRANSACTION,
                    "description": "Review large payments and decline payments involving a high-risk country.",
                    "trigger_object_type": "transactions",
                },
            )
        else:
            _, found = api("GET", "/scenario-iterations?scenario_id=" + transaction["id"])
            for item in found or []:
                if item.get("version") is None:
                    iteration = item
                    break
        if iteration is None:
            _, iteration = api(
                "POST",
                "/scenario-iterations",
                {
                    "scenario_id": transaction["id"],
                    "body": {
                    "trigger_condition_ast_expression": None,
                    "score_review_threshold": 30,
                    "score_block_and_review_threshold": 80,
                    "score_decline_threshold": 100,
                    "schedule": "",
                    "rules": [
                        {
                            "display_order": 1,
                            "name": "Large amount",
                            "description": "Amount is at least 10000.",
                            "formula_ast_expression": {
                                "name": ">=",
                                "children": [payload("amount"), {"constant": 10000}],
                            },
                            "score_modifier": 40,
                            "rule_group": "transaction",
                        },
                        {
                            "display_order": 2,
                            "name": "High-risk country",
                            "description": "Counterparty country is KP or IR.",
                            "formula_ast_expression": {
                                "name": "Or",
                                "children": [
                                    {"name": "=", "children": [payload("country"), {"constant": "KP"}]},
                                    {"name": "=", "children": [payload("country"), {"constant": "IR"}]},
                                ],
                            },
                            "score_modifier": 100,
                            "rule_group": "transaction",
                        },
                    ],
                },
            },
        )
        publish(iteration["id"])

    def base_fields(extra):
        return [
            field("object_id", "Object id", "String", False, "id"),
            field("updated_at", "Updated at", "Timestamp", False, "last_update"),
            *extra,
        ]

    def link_to(name, child_field, parent_id):
        return {
            "name": name,
            "link_type": "belongs_to",
            "child_field_name": child_field,
            "parent_table_id": parent_id,
        }

