apiVersion: v1
kind: Service
metadata:
  name: marble-redis
  namespace: aml
  labels:
    app: marble-redis
spec:
  selector:
    app: marble-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-redis
  namespace: aml
  labels:
    app: marble-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-redis
  template:
    metadata:
      labels:
        app: marble-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
