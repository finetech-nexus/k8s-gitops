apiVersion: v1
kind: ConfigMap
metadata:
  name: marble-env
  namespace: aml
data:
  ENV: production
  DISABLE_SEGMENT: "true"
  DISABLE_TELEMETRY: "true"
  LOGGING_FORMAT: json
  PG_HOSTNAME: marble-postgresql
  PG_PORT: "5432"
  PG_SSL_MODE: disable
  PG_DATABASE: marble
  FIREBASE_API_KEY: AIzaSyA4AnXx9RrDpAzl4D0msERm629zVgS8GOM
  FIREBASE_AUTH_DOMAIN: marble-a1227.firebaseapp.com
  FIREBASE_PROJECT_ID: marble-a1227
  GOOGLE_CLOUD_PROJECT: marble-a1227
  REDIS_HOST: marble-redis:6379
  OPENSANCTIONS_API_HOST: https://api.opensanctions.org
  OPENSANCTIONS_AUTH_METHOD: apikey
  OPENSANCTIONS_SCOPE: default
  SCREENING_OPENSANCTIONS_API_HOST: https://api.opensanctions.org
  SCREENING_OPENSANCTIONS_AUTH_METHOD: apikey
  SCREENING_OPENSANCTIONS_SCOPE: default
  SCREENING_ALGORITHM: logic-v2
  INGESTION_BUCKET_URL: file:///data/ingestion?create_dir=true
  CASE_MANAGER_BUCKET_URL: file:///data/cases?create_dir=true
  ANALYTICS_BUCKET_URL: file:///data/analytics?create_dir=true
  MARBLE_APP_URL: https://aml-app.dev.sandbox.nbank.fr
  MARBLE_API_URL: http://marble-api:8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: marble-migrations-v13
  namespace: aml
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h marble-postgresql -p 5432; do echo waiting for PostgreSQL; sleep 2; done"]
      containers:
        - name: migrations
          image: docker.io/nexusbank/marble-backend:latest
          imagePullPolicy: Always
          command: ["./app", "--migrations"]
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-api
  namespace: aml
  labels:
    app: marble-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-api
  template:
    metadata:
      labels:
        app: marble-api
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h marble-postgresql -p 5432; do echo waiting for PostgreSQL; sleep 2; done"]
      containers:
        - name: api
          image: docker.io/nexusbank/marble-backend:latest
          imagePullPolicy: Always
          command: ["./app", "--server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
            - name: SCREENING_OPENSANCTIONS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marble-opensanctions
                  key: api-key
            - name: OPENSANCTIONS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marble-opensanctions
                  key: api-key
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/firebase/service-account.json
          readinessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: firebase-credentials
          secret:
            secretName: marble
            items:
              - key: firebase-service-account.json
                path: service-account.json
---
apiVersion: v1
kind: Service
metadata:
  name: marble-api
  namespace: aml
  labels:
    app: marble-api
spec:
  selector:
    app: marble-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
