---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-app
  namespace: aml
  labels:
    app: marble-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-app
  template:
    metadata:
      labels:
        app: marble-app
      annotations:
        aml.nbank.fr/ui: "20261023-2"
      annotations:
        aml.nbank.fr/frontend: "2f42a5b3"
    spec:
      containers:
        - name: app
          image: docker.io/nexusbank/marble-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: session-secret
            - name: SESSION_MAX_AGE
              value: "43200"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              resolver=$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf)
              sed "s/__RESOLVER__/${resolver}/" /etc/nginx/nginx.conf.template > /tmp/nginx.conf
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - name: proxy
              containerPort: 8081
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf.template
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: proxy-config
          configMap:
            name: marble-app-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: marble-app
  namespace: aml
  labels:
    app: marble-app
spec:
  selector:
    app: marble-app
  ports:
    - name: http
      port: 8080
      targetPort: proxy
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marble-api
  namespace: aml
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    cert-manager.io/cluster-issuer: nbank-dev
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aml-api.api.dev.sandbox.internal.nbank.fr
      secretName: marble-api-dev-tls
  rules:
    - host: aml-api.api.dev.sandbox.internal.nbank.fr
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: marble-api
                port:
                  number: 8080
