apiVersion: v1
kind: ConfigMap
metadata:
  name: marble-env
  namespace: aml
data:
  ENV: production
  DISABLE_SEGMENT: "true"
  DISABLE_TELEMETRY: "true"
  LOGGING_FORMAT: json
  PG_HOSTNAME: marble-postgresql
  PG_PORT: "5432"
  PG_SSL_MODE: disable
  PG_DATABASE: marble
  AUTH_PROVIDER: oidc
  AUTH_OIDC_ISSUER: https://iam.dev.sandbox.internal.nbank.fr/auth/realms/internal
  AUTH_OIDC_CLIENT_ID: aml
  AUTH_OIDC_SCOPE: openid,email,profile
  CREATE_ORG_NAME: Nexus Bank
  REDIS_HOST: marble-redis:6379
  OPENSANCTIONS_API_HOST: http://marble-motiva:8000
  INGESTION_BUCKET_URL: file:///data/ingestion?create_dir=true
  CASE_MANAGER_BUCKET_URL: file:///data/cases?create_dir=true
  ANALYTICS_BUCKET_URL: file:///data/analytics?create_dir=true
  MARBLE_APP_URL: https://aml-app.dev.sandbox.internal.nbank.fr
  MARBLE_API_URL: http://marble-api:8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: marble-migrations
  namespace: aml
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h marble-postgresql -p 5432; do echo waiting for PostgreSQL; sleep 2; done"]
      containers:
        - name: migrations
          image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:v1.11.0
          imagePullPolicy: IfNotPresent
          command: ["./app", "--migrations"]
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-api
  namespace: aml
  labels:
    app: marble-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-api
  template:
    metadata:
      labels:
        app: marble-api
    spec:
      initContainers:
        - name: trust-internal-ca
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /ca/internal-ca.crt > /trust/ca-certificates.crt"]
          volumeMounts:
            - name: internal-ca
              mountPath: /ca
              readOnly: true
            - name: trust-bundle
              mountPath: /trust
        - name: wait-for-postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h marble-postgresql -p 5432; do echo waiting for PostgreSQL; sleep 2; done"]
      containers:
        - name: api
          image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:v1.11.0
          imagePullPolicy: IfNotPresent
          command: ["./app", "--server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
            - name: CREATE_ORG_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: admin-email
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: oidc-client-secret
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: license-key
          readinessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: trust-bundle
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: trust-bundle
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: marble-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: marble-api
  namespace: aml
  labels:
    app: marble-api
spec:
  selector:
    app: marble-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-worker
  namespace: aml
  labels:
    app: marble-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-worker
  template:
    metadata:
      labels:
        app: marble-worker
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h marble-postgresql -p 5432; do echo waiting for PostgreSQL; sleep 2; done"]
      containers:
        - name: worker
          image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:v1.11.0
          imagePullPolicy: IfNotPresent
          command: ["./app", "--worker"]
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-app
  namespace: aml
  labels:
    app: marble-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marble-app
  template:
    metadata:
      labels:
        app: marble-app
    spec:
      containers:
        - name: app
          image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-frontend:v1.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: marble-env
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: marble
                  key: session-secret
            - name: SESSION_MAX_AGE
              value: "43200"
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/certificate/internal-ca.crt
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/certificate
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: internal-ca
          configMap:
            name: marble-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: marble-app
  namespace: aml
  labels:
    app: marble-app
spec:
  selector:
    app: marble-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marble-api
  namespace: aml
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    cert-manager.io/cluster-issuer: nbank-dev
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aml-api.api.dev.sandbox.internal.nbank.fr
      secretName: marble-api-dev-tls
  rules:
    - host: aml-api.api.dev.sandbox.internal.nbank.fr
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: marble-api
                port:
                  number: 8080
---
