apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - database.yaml
  - redis.yaml
  - screening.yaml
  - marble.yaml
  - init-config.yaml
configMapGenerator:
  - name: marble-internal-ca
    namespace: aml
    files:
      - internal-ca.crt
    options:
      disableNameSuffixHash: true
