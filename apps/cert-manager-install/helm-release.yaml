# cert-manager: install before ClusterIssuers; apps Kustomization dependsOn this.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      version: "v1.14.4"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 1m
  install:
    createNamespace: false  # namespace created by kustomization
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    # Controller needs enough RAM to avoid OOM (exit 137) and liveness timeouts. The chart
    # default is ~128Mi request; 64Mi was too low with concurrent ACME challenges / API watches.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
