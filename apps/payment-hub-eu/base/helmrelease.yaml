# Payment Hub from HelmRepository OCI (payment-hub-helm-charts). Chart published to ghcr.io/finetech-nexus/payment-hub-helm-chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payment-hub
  namespace: payment-hub-eu
spec:
  interval: 5m
  # Scale every workload to 0. Values cannot do this for every chart
  # (MinIO standalone hardcodes replicas: 1; Zeebe uses clusterSize).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: scale-to-zero
              spec:
                replicas: 0
          - target:
              group: apps
              version: v1
              kind: StatefulSet
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: scale-to-zero
              spec:
                replicas: 0
  chart:
    spec:
      chart: payment-hub
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: payment-hub-helm-chart-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: payment-hub-values
      valuesKey: values.yaml
