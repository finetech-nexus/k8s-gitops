# Hosts: *.payment-hub.dev.sandbox.internal.nbank.fr; IAM/fynams: dev.sandbox.internal.nbank.fr. TLS: cert-manager ClusterIssuer nbank-dev.
ph-ee-engine:
  enabled: true
  global:
    SPRING_PROFILES_ACTIVE: "bb,fin12,tenantsConnection"
    imagePullPolicy: "Always"
    LOGGING_LEVEL_ROOT: "INFO"
    # LOGGING_PATTERN_CONSOLE: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    tenants: "nexusbankeu"
    DFSPIDS: "nexusbank,nexusbankeu"
  # we use elastic and kibana from the infra namespace
  elasticsearch:
    enabled: false
  kibana:
    enabled: false


  importer_rdbms:
    enabled: true
    replicas: 1
    image: docker.io/openmf/ph-ee-importer-rdbms:v1.13.1-gazelle-1.1.0
    imagePullPolicy: IfNotPresent
    SPRING_PROFILES_ACTIVE: "rdbms,tenantsConnection"
    LOGGING_LEVEL_ROOT: "INFO"
    datasource:
      host: "mysql.infra-eu.svc.cluster.local"
      # note both datasource and datasource.core are used by the rdbms chart
      # TODO: remove datasource.core from the rdbms chart
      core:
        host: mysql.infra-eu.svc.cluster.local
        port: 3306
        schema: "tenants"
        username: "mifos"
        password: "password"
    deployment:
      extraEnvs:
        - name: KAFKA_BROKERS
          value: kafka.infra-eu.svc.cluster.local:9092


  camunda-platform:
    global:
      elasticsearch:
        # Elasticsearch.disableExporter if true, disables the elastic exporter in zeebe
        disableExporter: false
        host: "infra-elasticsearch.infra-eu.svc.cluster.local"
        port: 9200
        clusterName: "fred"
      identity:
        auth:
          enabled: false

    zeebe:
      enabled: true
      broker:
        contactpoint: "ph-ee-gazelle-zeebe-gateway:26500"
      env:
        - name: ZEEBE_EXPORTERS_KAFKA_ARGS_PRODUCER_SERVERS
          value: kafka.infra-eu.svc.cluster.local:9092
        - name: ZEEBE_BROKER_BACKPRESSURE_ENABLED
          value: "false"
        - name: ZEEBE_BROKER_EXECUTION_METRICS_EXPORTER_ENABLED
          value: "true"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_JARPATH
          value: "/exporters/ph-ee-kafka-exporter.jar"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_CLASSNAME
          value: "hu.dpc.rt.kafkastreamer.exporter.KafkaExporter"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_INITIALLIMIT
          value: "1000"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_ALPHA
          value: "2"
        - name: ZEEBE_BROKER_BACKPRESSURE_VEGAS_BETA
          value: "8"
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_EVENT
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_VARIABLE
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_PROCESSINSTANCE
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_PROCESS
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_INCIDENT
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_DEPLOYMENT
          value: 'true'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_ERROR
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_JOB
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_VARIABLEDOCUMENT
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_WORKFLOWINSTANCE
          value: 'false'
        - name: ZEEBE_BROKER_EXPORTERS_KAFKA_ARGS_INDEX_CREATETEMPLATE
          value: 'false'
      resources:
        requests:
          cpu: 200m
          memory: 1200Mi
        limits:
          cpu: 960m
          memory: 1920Mi
      affinity: {}
      extraInitContainers:
        - name: init-ph-ee-kafka-exporter
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args: ['wget -O /exporters/ph-ee-kafka-exporter.jar "https://mifos.jfrog.io/artifactory/phee-gradle-local/org/mifos/phee/phee-exporter/exporter-1.1.1-SNAPSHOT.jar"; ls -al /exporters/']
          volumeMounts:
            - name: exporters
              mountPath: /exporters/

    zeebe-gateway:
      replicas: 1
      logLevel: debug
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 750Mi
      affinity: {}

      ingress:
        enabled: true
        host: "zeebe-gateway.payment-hub.dev1.sandbox.internal.nbank.fr"
        annotations:
          cert-manager.io/cluster-issuer: nbank-dev
        tls:
          enabled: true
          secretName: zeebe-gateway-ph-dev-tls1

    operate:
      enabled: true
      replicas: 1
      logging:
        level:
          ROOT: INFO
          io.camunda.operate: DEBUG

      resources:
        requests:
          cpu: 300m
          memory: 400Mi

      affinity: {}

      ingress:
        enabled: true
        host: "zeebe-operate.payment-hub.dev1.sandbox.internal.nbank.fr"
        annotations:
          cert-manager.io/cluster-issuer: nbank-dev
        tls:
          enabled: true
          secretName: zeebe-operate-ph-dev-tls1

    tasklist:
      enabled: true

    optimize:
      enabled: false

    identity:
      enabled: false

    connectors:
      enabled: false

    elasticsearch:
      enabled: false
  #### end of camunda-platform

  ph_ee_connector_mojaloop:
    enabled: false
    image: docker.io/nexusbank/ph-ee-connector-mojaloop-java:1.5.2
    imagePullPolicy: Always
    limits:
      memory: "1024M"
      cpu: "700m"
    requests:
      memory: "512M"
      cpu: "100m"
    ingress:
      enabled: true
      className: nginx
    switch:
      quotes:
        service: ""
      als:
        host: "http://fspiop-api-svc.vnext.svc.cluster.local:4000"
      transfers:
        host: http://fspiop-api-svc.vnext.svc.cluster.local:4000
        service: http://fspiop-api-svc.vnext.svc.cluster.local:4000
      transactions:
        host: http://fspiop-api-svc.vnext.svc.cluster.local:4000
        service: http://fspiop-api-svc.vnext.svc.cluster.local:4000
      oracle:
        host: http://fspiop-api-svc.vnext.svc.cluster.local:4000
    deployment:
      extraEnvs:
        - name: MOJALOOP_ENABLED
          value: "false"
        - name: parties_0_domain
          value: "https://fynams.dev.sandbox.internal.nbank.fr"
        - name: parties_1_domain
          value: "https://mojaloop.payment-hub.dev.sandbox.internal.nbank.fr"
        - name: parties_0_tenantId
          value: "nexusbank"
        - name: parties_1_tenantId
          value: "bluebank"
        - name: parties_0_fspId
          value: "nexusbank"
        - name: parties_1_fspId
          value: "bluebank"
        - name: "LOGGING_LEVEL_ROOT"
          value: "DEBUG"
        - name: "SWITCH_ALS_HOST"
          value: "http://fspiop-api-svc.vnext.svc.cluster.local:4000"

  post_installation_job:
    enabled: false

  integration_test:
    #TODO
    enabled: false
    enableAMSTest: false
    enableGOVTest: false
    enableGazelleTest: true
    imagePullPolicy: IfNotPresent
    image: docker.io/openmf/ph-ee-integration-test:v1.6.2-gazelle
    testTags: "@gov and not @ext"
    memoryRequest: "500k"
    testResultsOutputDir: "/tmp"

  operations_app:
    enabled: true
    #TENANTS: "gorilla"
    #defaultTenant: "nexusbank"
    SPRING_PROFILES_ACTIVE: "tenantsConnection,bb"
    secret:
      datasource:
        host: mysql.infra-eu.svc.cluster.local
    datasource:
      username: "mifos"
      password: "password"
      host: mysql.infra-eu.svc.cluster.local
      port: 3306
      schema: "tenants"
    image:  docker.io/nexusbank/ph-ee-operations-app:1.17.1
    replicas: 1
    extraEnvs:
      - name: "BAASFLOW_EVENTS_DISABLED"
        value: "true"
      - name: "BAASFLOW_EVENTS_KAFKA_BROKERS"
        value: "kafka.infra-eu.svc.cluster.local:9092"
      - name: "BAASFLOW_EVENTS_CHANNELS_AUDIT_TOPIC"
        value: "auditlog"
      - name: "FRONTEND_CALLBACK_URL_BASE"
        value: "ops-bk-web.payment-hub.dev1.sandbox.internal.nbank.fr"
      - name: "CHANNEL-CONNECTOR_URL"
        value: "channel.payment-hub.dev1.sandbox.internal.nbank.fr"
      - name: "CHANNEL-CONNECTOR_TRANSFER-PATH"
        value: "/channel/transfer"
      - name: "ZEEBE_GATEWAY_ADDRESS"
        value: "ph-ee-gazelle-zeebe-gateway:26500"
      - name: "SPRING_LIQUIBASE_CONTEXTS"
        value: "postgresql,initial_switch,tenant_store_db"
      - name: "SPRING_CONFIG_ADDITIONAL_LOCATION"
        value: "/config/"
    limits:
      memory: "3000M"
      cpu: "800m"
    requests:
      memory: "1000M"
      cpu: "500m"
    readinessProbe:
      httpGet:
        path: /oauth/token_key
        port: 5000
        httpHeaders:
          - name: Platform-TenantId
            value: nexusbank
        scheme: HTTP
      initialDelaySeconds: 120
      timeoutSeconds: 1
      periodSeconds: 30
      successThreshold: 1
      failureThreshold: 3
    ingress:
      enabled: true
      className: nginx
      annotations:
        kubernetes.io/ingress.class: "nginx"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        cert-manager.io/cluster-issuer: nbank-dev
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://ops-bk-web.payment-hub.dev1.sandbox.internal.nbank.fr"
        nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Platform-TenantId"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      tls:
        - hosts:
            - ops-bk.payment-hub.dev1.sandbox.internal.nbank.fr
          secretName: ops-bk-dev-tls1
      hosts:
        - host: ops-bk.payment-hub.dev1.sandbox.internal.nbank.fr
          paths:
            - path: "/"
              backend:
                service:
                  name: "ph-ee-operations-app"
                  port:
                    number: 80

  operations_web:
    enabled: true
    image: docker.io/openmf/ph-ee-operations-web:gazelle-v1.1.0
    ingress:
      enabled: true
      className: nginx
      annotations:
        kubernetes.io/ingress.class: "nginx"
        cert-manager.io/cluster-issuer: nbank-dev
      tls:
        - hosts:
            - ops-bk-web.payment-hub.dev1.sandbox.internal.nbank.fr
          secretName: ops-bk-web-dev-tls1
      hosts:
        - host: ops-bk-web.payment-hub.dev1.sandbox.internal.nbank.fr
          paths:
            - path: "/"
              backend:
                service:
                  name: "ph-ee-operations-web"
                  port:
                    number: 4200
            - path: "/paymenthub"
              pathType: Prefix
              backend:
                service:
                  name: "ph-ee-operations-app"
                  port:
                    number: 4200
    backend:
      PH_OPS_BACKEND_SERVER_URL: https://ops-bk.payment-hub.dev1.sandbox.internal.nbank.fr/api/v1
      PH_VOU_BACKEND_SERVER_URL: https://vouchers-demo.payment-hub.dev1.sandbox.internal.nbank.fr
      PH_ACT_BACKEND_SERVER_URL: https://identity-mapper-demo.payment-hub.dev1.sandbox.internal.nbank.fr
      PH_PLATFORM_TENANT_ID: nexusbank
      PH_PLATFORM_TENANT_IDS: nexusbank,bluebank
      PH_REGISTERING_INSTITUTION_ID: 123
    auth:
      PH_OAUTH_ENABLED: false
      PH_OAUTH_TYPE: keycloak
      PH_OAUTH_SERVER_URL: https://iam.dev.sandbox.internal.nbank.fr/auth
      PH_OAUTH_REALM: paymenthub
      PH_OAUTH_CLIENT_ID: opsapp
      PH_OAUTH_CLIENT_SECRET: YMoGqfaBo9aBmxMbT6x3L8PMUxvz5PSh
      PH_OAUTH_BASIC_AUTH: true
      PH_OAUTH_BASIC_AUTH_TOKEN: YMoGqfaBo9aBmxMbT6x3L8PMUxvz5PSh
    PH_DEFAULT_LANGUAGE: en
    PH_SUPPORTED_LANGUAGES: en,fr,es
