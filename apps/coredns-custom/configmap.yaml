# k3s CoreDNS custom config. *.server = dedicated zone so our names are handled first.
# All *.dev.sandbox.internal.nbank.fr hostnames resolve to the ingress IP; traffic goes through ingress (TLS, routing).
# Replace the IP below with ingress-nginx ClusterIP: kubectl get svc -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx -o jsonpath='{.items[0].spec.clusterIP}'
# See: https://docs.k3s.io/installation/network-options#custom-coredns
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  internal.server: |
    dev.sandbox.internal.nbank.fr:53 {
      hosts {
        10.43.169.196 minio.payment-hub.dev.sandbox.internal.nbank.fr minio-console.payment-hub.dev.sandbox.internal.nbank.fr channel.payment-hub.dev.sandbox.internal.nbank.fr swift.payment-hub.dev.sandbox.internal.nbank.fr sibtel.payment-hub.dev.sandbox.internal.nbank.fr mt.payment-hub.dev.sandbox.internal.nbank.fr simulator.payment-hub.dev.sandbox.internal.nbank.fr sibtel-app.payment-hub.dev.sandbox.internal.nbank.fr sibtel-api.payment-hub.dev.sandbox.internal.nbank.fr iam.dev.sandbox.internal.nbank.fr fynams.dev.sandbox.internal.nbank.fr web-app.dev.sandbox.internal.nbank.fr produit-app.dev.sandbox.internal.nbank.fr notification-app.dev.sandbox.internal.nbank.fr notification-app.payment-hub.dev.sandbox.internal.nbank.fr notification-api.api.dev.sandbox.internal.nbank.fr notification-api.payment-hub.dev.sandbox.internal.nbank.fr mt-app.dev.sandbox.internal.nbank.fr mt-app.payment-hub.dev.sandbox.internal.nbank.fr mt-api.api.dev.sandbox.internal.nbank.fr mt-api.payment-hub.dev.sandbox.internal.nbank.fr swift-app.dev.sandbox.internal.nbank.fr swift-app.payment-hub.dev.sandbox.internal.nbank.fr swift-api.api.dev.sandbox.internal.nbank.fr swift-api.payment-hub.dev.sandbox.internal.nbank.fr cbanking-api.api.dev.sandbox.internal.nbank.fr app.api.dev.sandbox.internal.nbank.fr app-ws.api.dev.sandbox.internal.nbank.fr hooks-api.dev.sandbox.internal.nbank.fr kyc-api.api.dev.sandbox.internal.nbank.fr produit-api.api.dev.sandbox.internal.nbank.fr card-management-api.api.dev.sandbox.internal.nbank.fr invest-api.api.dev.sandbox.internal.nbank.fr workflowsvc.kyc.dev.sandbox.internal.nbank.fr workflowdashboard.kyc.dev.sandbox.internal.nbank.fr backoffice.kyc.dev.sandbox.internal.nbank.fr reconciliation-api.api.dev.sandbox.internal.nbank.fr reconciliation-app.dev.sandbox.internal.nbank.fr
