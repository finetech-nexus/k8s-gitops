# NGINX Ingress Controller — official Kubernetes chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 5m
  chart:
    spec:
      chart: ingress-nginx
      version: "~4.14"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      config:
        # Enforce TLS 1.2+ (avoids "tlsv1 alert protocol version" with modern clients e.g. LibreSSL)
        ssl-protocols: "TLSv1.2 TLSv1.3"
      service:
        type: LoadBalancer
      # Optional: tune resources
      resources:
        requests:
          cpu: 50m
          memory: 90Mi
        limits:
          cpu: 200m
          memory: 256Mi
