# Finexus marketing site from OCI (finexus-web/helm chart published to ghcr.io/.../finexus-web).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finexus-web
  namespace: finexus-web
spec:
  interval: 5m
  chart:
    spec:
      chart: finexus-web
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: finexus-web-oci
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: finexus-web-values
      valuesKey: values.yaml
