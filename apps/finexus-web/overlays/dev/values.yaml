# Dev — Finexus marketing site on nbank.fr
replicaCount: 1

image:
  repository: nexusbank/finexus-web
  tag: latest
  pullPolicy: Always

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nbank
  hosts:
    - host: nbank.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - nbank.fr
      secretName: nbank-fr-tls
