# Layer 3 — Core-banking, payment-hub
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-banking
  namespace: flux-system
spec:
  suspend: false  # core-banking (and payment-hub) active
  interval: 5m0s
  path: ./apps/overlays/dev/03-core
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  timeout: 10m0s
