# Layer 4 — Payment-hub
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payment-hub
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/payment-hub/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
    - name: sources
      namespace: flux-system
    - name: core-banking
      namespace: flux-system
  timeout: 15m0s

