# AI API (KYC ML + future AML)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-api
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/ai-api/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
  timeout: 10m0s
