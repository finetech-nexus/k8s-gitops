# CoreDNS custom: in-cluster DNS for *.dev.sandbox.internal.nbank.fr (k3s coredns-custom)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-custom
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./apps/coredns-custom
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  timeout: 2m0s
