# TreasoryFlow: app, API and PostgreSQL in namespace treasury.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: treasury
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/treasury/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 10m0s
