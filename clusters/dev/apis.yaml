# Layer 4 — APIs & product: api (nexus-bank-api, core-banking-api), kyc
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apis
  namespace: flux-system
spec:
  suspend: true  # disabled (re-enable by setting to false)
  interval: 5m0s
  path: ./apps/overlays/dev/04-apis
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
      namespace: flux-system
  timeout: 10m0s
