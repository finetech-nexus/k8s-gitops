# Layer 4 — APIs: api namespace (core-banking-api only). nexus-bank-api is in app layer (05-app).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apis
  namespace: flux-system
spec:
  suspend: false  # apis layer: api (nexus-bank-api, core-banking-api) + kyc
  interval: 5m0s
  path: ./apps/overlays/dev/04-apis
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core-banking
      namespace: flux-system
    - name: ingress-nginx
      namespace: flux-system
  timeout: 10m0s
