# Kong routes and plugins (Gateway, HTTPRoutes, KongPlugin). Depends on kong so CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-routes
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/kong/overlay
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
      namespace: flux-system
  timeout: 5m0s
