# Fluent Bit → Elasticsearch (TN residency only; EU shipper not deployed).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  path: ./apps/logging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sources
      namespace: flux-system
    - name: infra
      namespace: flux-system
  timeout: 10m
