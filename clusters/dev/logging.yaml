# Fluent Bit → Elasticsearch.
# Residency (TN/EU ES) is the shipping axis; functional_perimeter is the log field for metier views.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  path: ./apps/logging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sources
      namespace: flux-system
    - name: infra
      namespace: flux-system
    - name: infra-eu
      namespace: flux-system
  timeout: 10m
