# Install cert-manager first; apps (ClusterIssuers, etc.) depend on this
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/cert-manager-install
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  timeout: 5m0s
