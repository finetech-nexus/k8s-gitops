# KYC EU (namespace kyc-eu): Ballerine workflows, backoffice, workflow dashboard.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyc-eu
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/kyc-eu/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core-banking-eu
      namespace: flux-system
  timeout: 5m0s
