# Layer 5 — App (BFF nexus-bank-api + Product Studio in namespace app)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/overlays/dev/05-app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: apis
      namespace: flux-system
  timeout: 5m0s
