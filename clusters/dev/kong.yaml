# Kong APIM — API gateway (enabled while platform/identity/core/apis suspended)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./apps/kong
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  timeout: 5m0s
  # cert-manager omitted when only Kong is active (cert-manager suspended)
