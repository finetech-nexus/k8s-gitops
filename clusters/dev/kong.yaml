# Kong APIM — API gateway. TLS via cert-manager (nbank-dev); URLs *.dev.sandbox.internal.nbank.fr; no AWS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/kong
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 5m0s
