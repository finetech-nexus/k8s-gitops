# Layer 2 — IAM (Keycloak, PostgreSQL)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iam
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/overlays/dev/02-identity
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform
      namespace: flux-system
  timeout: 5m0s
