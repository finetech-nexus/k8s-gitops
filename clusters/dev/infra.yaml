# Infra app: Kafka, ZK, ES, Kibana, etc. (namespace infra)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/overlays/dev/06-infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform
      namespace: flux-system
  timeout: 5m0s
