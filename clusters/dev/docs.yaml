# Docusaurus docs (HelmRelease in namespace docs, Ingress docs.nbank.fr)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docs
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/docs/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # HelmRepository docs-oci is applied with this stack (apps/docs/base/helmrepository.yaml).
    - name: ingress-nginx
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 5m0s
