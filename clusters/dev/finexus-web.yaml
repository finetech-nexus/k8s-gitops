# Finexus marketing site (HelmRelease in namespace finexus-web, Ingress finexus.nbank.fr)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finexus-web
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/finexus-web/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 5m0s
