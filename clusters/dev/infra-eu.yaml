# Infra EU (namespace infra-eu): Kafka, MySQL, etc. for EU stack.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-eu
  namespace: flux-system
spec:
  suspend: true  # EU stack kept at 0 pods
  interval: 5m0s
  path: ./apps/infra-eu/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform
      namespace: flux-system
  timeout: 5m0s
