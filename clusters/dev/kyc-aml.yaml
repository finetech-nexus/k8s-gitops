# Clarity KYC and AML, namespace kyc-aml. kyc-api calls this service in-cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyc-aml
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/kyc-aml/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 15m0s
