# Marble: screening index, API, console and AML configuration in namespace aml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aml
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/aml/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  timeout: 30m0s
