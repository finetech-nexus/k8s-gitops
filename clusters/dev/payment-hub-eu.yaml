# Payment Hub EU (namespace payment-hub-eu).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payment-hub-eu
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/payment-hub-eu/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
    - name: sources
      namespace: flux-system
  timeout: 15m0s
