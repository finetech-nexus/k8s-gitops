# Core Banking EU (namespace core-banking-eu): Fineract + webapp + fineract-hook.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-banking-eu
  namespace: flux-system
spec:
  suspend: false
  interval: 5m0s
  path: ./apps/core-banking-eu/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
    - name: sources
      namespace: flux-system
  timeout: 10m0s
