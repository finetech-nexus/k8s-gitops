# Grafana + Prometheus — dashboards filtered by functional perimeter (metier).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  path: ./apps/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sources
      namespace: flux-system
    - name: ingress-nginx
      namespace: flux-system
  timeout: 15m
